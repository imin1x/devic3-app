<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devic3</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devic3">
<link id="externalIconsCss" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link id="externalFontCss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#000000; --card:#111111; --border:#242424; --border-strong:#333333;
    --text:#d4d4d4; --text-2:#9a9a9a; --text-muted:#6a6a6a;
    --accent:#4d94ff; --accent-bg:#12233d; --accent-text:#8cbaff;
    --danger:#e05a5a; --danger-bg:#3a1414; --danger-text:#ff9a9a;
    --success:#3fbf83; --success-bg:#0e2b1e;
    --comment:#6a9955;
    --sidebar-bg:#0a0a0a; --panel-bg:#0a0a0a;
    --radius:6px;
    --mono:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden; max-width:100vw;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--mono);
    min-height:100vh; overflow:hidden; max-width:100vw;
  }
  ::selection{background:var(--accent-bg); color:var(--accent-text);}
  .code-comment{color:var(--comment);}
  .wrap{width:100%; max-width:640px;}
  h1{font-size:20px; font-weight:500; margin:0 0 4px; color:var(--text); text-align:center;}
  .sub{color:var(--text-2); font-size:14px; margin:0 0 24px; text-align:center;}
  .card{background:var(--card); border:0.5px solid var(--border); border-radius:12px; padding:24px;}
  label{display:block; font-size:13px; color:var(--text-2); margin-bottom:6px; font-weight:500;}
  input[type=text], input[type=password], textarea, select{
    width:100%; padding:9px 12px; border-radius:var(--radius); border:0.5px solid var(--border-strong);
    background:#050505; font-size:14px; color:var(--text); margin-bottom:14px; font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{outline:none; box-shadow:0 0 0 2px var(--accent-bg); border-color:var(--accent);}
  textarea{resize:vertical; min-height:60px;}
  select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237a7a7a' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; padding-right:32px;}
  button{
    border-radius:var(--radius); border:0.5px solid var(--border-strong); background:#141414;
    padding:9px 16px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;
  }
  button:hover{background:#1f1f1f;}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--accent); color:#001229; border-color:var(--accent); font-weight:600;}
  button.primary:hover{background:#69a6ff;}
  button.danger{color:var(--danger-text); border-color:var(--danger);}
  button.danger:hover{background:var(--danger-bg);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .row{display:flex; gap:10px;}
  .err{color:var(--danger-text); font-size:13px; margin:-6px 0 14px; display:none;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .topbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  @media (max-width: 640px){
    .topbar{gap:8px;}
    .topbar .text-btn span, .topbar .text-btn{font-size:12px;}
    .topbar-actions .text-btn span, .topbar-actions .text-btn{font-size:12px;}
  }
  .folder-panel{border:0.5px solid var(--border); border-radius:12px; margin-bottom:18px; overflow:hidden;}
  .folder-toggle{width:100%; display:flex; align-items:center; justify-content:space-between; background:transparent; border:none; padding:10px 12px; cursor:pointer; color:var(--text); font-size:13px; font-family:inherit;}
  .folder-toggle:hover{background:#1f1f1f;}
  .folder-toggle-right{display:flex; align-items:center; gap:8px;}
  .folder-toggle-count{font-size:11px; color:var(--text-muted); background:#1f1f1f; border-radius:999px; padding:1px 8px;}
  .folder-toggle .ti-chevron-down{transition:transform .15s; font-size:14px; color:var(--text-muted);}
  .folder-panel.open .folder-toggle .ti-chevron-down{transform:rotate(180deg);}
  .folder-list{max-height:0; overflow:hidden; transition:max-height .2s ease; display:flex; flex-direction:column; gap:4px;}
  .folder-panel.open .folder-list{max-height:220px; overflow-y:auto; padding:0 6px 6px; border-top:0.5px solid var(--border); margin-top:2px; padding-top:6px; scrollbar-width:thin;}
  .folder-list::-webkit-scrollbar{width:5px;}
  .folder-list::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:999px;}
  .folder-list::-webkit-scrollbar-track{background:transparent;}
  .export-platform-list{
    display:flex; flex-direction:column; gap:4px; max-height:240px; overflow-y:auto;
    border:0.5px solid var(--border); border-radius:12px; padding:6px; scrollbar-width:thin;
  }
  .export-platform-list::-webkit-scrollbar{width:5px;}
  .export-platform-list::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:999px;}
  .export-platform-list::-webkit-scrollbar-track{background:transparent;}
  .platform-bar{display:flex; flex-direction:column; gap:2px;}
  .platform-chip{flex-shrink:0;}
  .platform-chip{
    display:flex; align-items:center; gap:10px; padding:8px 16px; border-radius:0; border:none;
    border-left:2px solid transparent; background:transparent; font-size:13px; cursor:pointer;
    color:var(--text-2); white-space:nowrap; width:100%; text-align:left; text-decoration:none; box-sizing:border-box;
  }
  .platform-icon{
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    position:relative; overflow:hidden; transition:transform 0.2s;
    background:linear-gradient(150deg, color-mix(in srgb, var(--pcolor) 100%, white 30%) 0%, var(--pcolor) 55%, color-mix(in srgb, var(--pcolor) 100%, black 25%) 100%);
    box-shadow:0 2px 5px -1px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .platform-icon svg.pf-svg{position:relative; z-index:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.3)); overflow:visible;}
  .platform-chip .platform-icon svg.pf-svg{width:16px; height:16px;}
  .platform-bar .platform-icon::after{
    content:''; position:absolute; top:-60%; left:-70%; width:45%; height:220%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.65), transparent);
    transform:rotate(20deg); animation: platformShine 3.4s ease-in-out infinite;
  }
  @keyframes platformShine{
    0%{ left:-70%; }
    55%{ left:130%; }
    100%{ left:130%; }
  }
  .platform-chip .platform-icon{width:20px; height:20px;}
  .platform-chip:hover{background:#1a1a1a;}
  .platform-chip:hover .platform-icon{transform:scale(1.12) rotate(-3deg);}
  .platform-bar .platform-chip:nth-child(1) .platform-icon::after{animation-delay:0s;}
  .platform-bar .platform-chip:nth-child(2) .platform-icon::after{animation-delay:0.5s;}
  .platform-bar .platform-chip:nth-child(3) .platform-icon::after{animation-delay:1.0s;}
  .platform-bar .platform-chip:nth-child(4) .platform-icon::after{animation-delay:1.5s;}
  .platform-bar .platform-chip:nth-child(5) .platform-icon::after{animation-delay:2.0s;}
  .platform-bar .platform-chip:nth-child(6) .platform-icon::after{animation-delay:2.5s;}
  .platform-chip.active{background:var(--accent-bg); color:var(--accent-text); border-left-color:var(--pcolor, var(--accent)); font-weight:600;}
  .platform-chip-count{margin-left:auto; font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .platform-chip.active .platform-chip-count{color:var(--accent-text);}
  .folder-chip{padding:8px 12px; border-radius:8px; border:0.5px solid transparent; background:transparent; font-size:13px; cursor:pointer; color:var(--text-2); white-space:nowrap; width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  .folder-chip:hover{background:#1f1f1f;}
  .folder-chip.active{background:#ffffff; color:#000000; border-color:#ffffff; font-weight:500;}
  .folder-chip:not(.folder-manage-btn) span:last-child{font-size:11px; color:var(--text-muted); background:#1f1f1f; border-radius:999px; padding:1px 8px; flex-shrink:0; margin-left:8px;}
  .folder-chip.active:not(.folder-manage-btn) span:last-child{color:#000; background:rgba(0,0,0,0.1);}
  .folder-manage-btn{padding:8px 12px; border-radius:8px; font-size:13px; color:var(--text); flex-shrink:0; border-style:dashed; border-color:var(--border-strong); justify-content:flex-start; gap:6px;}
  .folder-manage-btn:hover{background:#1f1f1f; border-color:var(--text-2);}
  .entry{background:var(--card); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; min-width:0; overflow:hidden;}
  .entry-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer; min-width:0;}
  .entry-info{min-width:0; flex:1;}
  .entry-name{font-weight:500; font-size:15px; margin:0 0 2px; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;}
  .entry-name i.chevron{font-size:14px; color:var(--text-muted); transition:transform 0.15s;}
  .entry.expanded .entry-name i.chevron{transform:rotate(90deg);}
  .entry-details{overflow:hidden; max-height:0; transition:max-height 0.15s ease;}
  .entry.expanded .entry-details{max-height:1000px;}
  .entry-id{font-size:13px; color:var(--text-2); margin:0; word-break:break-all;}
  .totp-code{font-family:var(--font-mono, monospace); color:var(--accent-text); font-weight:600; letter-spacing:1.5px; cursor:pointer; padding:1px 4px; border-radius:4px;}
  .totp-code:hover{background:var(--accent-bg);}
  .copy-inline{cursor:pointer; padding:1px 3px; border-radius:4px; overflow-wrap:break-word; word-break:break-word;}
  .copy-inline:hover{background:#1f1f1f; color:var(--text) !important;}
  .status-badge{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .status-filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .status-filter-chip{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
    border:0.5px solid var(--sc, var(--border-strong)); background:transparent; color:var(--sc, var(--text-2));
    font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .status-filter-chip:hover{background:rgba(255,255,255,0.05);}
  .status-filter-chip .status-filter-count{color:var(--text-muted); font-weight:400;}
  .status-filter-chip.hidden-state{opacity:0.4; border-style:dashed; text-decoration:line-through;}
  .status-filter-chip i{font-size:14px;}
  .entry-meta-row{display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; min-width:0; max-width:100%;}
  .entry-meta-row .entry-folder{margin-top:0;}
  .entry-name .platform-icon svg.pf-svg{width:12px; height:12px;}
  .entry-folder{display:inline-block; font-size:11px; color:var(--text-muted); background:#1f1f1f; border-radius:5px; padding:2px 7px; margin-top:6px;}
  .entry-created{display:inline-flex; align-items:center; gap:3px; font-size:11px; color:var(--text-muted);}
  .new-badge{display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; letter-spacing:0.3px; color:#000; background:#facc15; padding:2px 7px; border-radius:999px; box-shadow:0 0 8px -2px rgba(250,204,21,0.6);}
  .entry-fieldrow{display:flex; align-items:center; flex-wrap:wrap; font-size:13px; margin-top:5px; row-gap:4px; min-width:0;}
  .otp-inline-btn{margin-left:6px; padding:4px 9px; font-size:11px;}
  .field-chip{cursor:pointer; padding:2px 5px; border-radius:4px; white-space:normal; overflow-wrap:break-word; color:var(--text-2); display:inline-flex; align-items:baseline; gap:4px; max-width:100%;}
  .field-chip:hover{background:#1c1c1c; color:var(--text);}
  .field-chip .field-label{color:var(--text-muted); font-size:11px;}
  .field-chip .field-val{font-family:var(--mono);}
  .field-chip.secret .field-val{letter-spacing:2px;}
  .field-chip.totp .field-val{font-weight:700; letter-spacing:1px; transition:color .3s ease;}
  .field-sep{color:var(--border-strong); margin:0 2px; user-select:none;}
  .entry-extra-toggle{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-muted); cursor:pointer; margin-top:6px; padding:2px 0; width:fit-content;}
  .entry-extra-toggle:hover{color:var(--text-2);}
  .entry-extra-toggle i{font-size:12px; transition:transform .15s;}
  .entry-extra-toggle.open i{transform:rotate(90deg);}
  .entry-extra{display:none;}
  .entry-extra.open{display:block;}
  .entry-actions{display:flex; gap:6px; flex-shrink:0;}
  .entry-checkbox{width:20px; height:20px; cursor:pointer; accent-color:#ffffff;}
  .select-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; padding:9px 12px; background:var(--card); border:0.5px solid var(--border); border-radius:10px; font-size:13px; color:var(--text-2); flex-wrap:wrap;}
  .select-bar-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .icon-btn{padding:6px 8px; line-height:1;}
  .icon-btn i{font-size:15px; vertical-align:-2px;}
  .text-btn{padding:6px 12px; font-size:13px; line-height:1.2; white-space:nowrap;}
  .text-btn i{font-size:14px; vertical-align:-2px; margin-right:4px;}
  .pw-row{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:0.5px solid var(--border); font-size:13px;}
  .pw-val{font-family:var(--font-mono, monospace); color:var(--text-2); letter-spacing:0.5px; flex:1; word-break:break-all;}
  .tools-card{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card); border:0.5px solid var(--border); border-radius:10px; padding:16px 18px;
  }
  .tools-card:hover{border-color:var(--border-strong); background:#161616;}
  .tools-card i:first-child{font-size:22px; color:var(--accent-text); flex-shrink:0;}
  .tools-card-title{font-size:14px; font-weight:600; color:var(--text);}
  .tools-card-arrow{margin-left:auto; color:var(--text-muted); flex-shrink:0;}
  .pw-tag{color:var(--text-muted); flex-shrink:0;}
  .empty{text-align:center; color:var(--text-muted); padding:48px 0; font-size:14px;}
  .empty .platform-icon svg.pf-svg{width:22px; height:22px;}
  .lock-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 0;}
  .lock-icon{width:48px; height:48px; border-radius:50%; background:var(--accent-bg); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:16px;}
  .center-form{max-width:340px; margin:0 auto; width:100%;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#ffffff; color:#000000; padding:10px 18px; border-radius:var(--radius); font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.2s; z-index:20;}
  .toast.show{opacity:1;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card); border-radius:12px; padding:24px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; border:0.5px solid var(--border);}
  .modal h2{font-size:18px; font-weight:500; margin:0 0 16px; color:var(--text);}
  .hint{font-size:12px; color:var(--text-muted); margin:-10px 0 16px;}
  .tabs{display:flex; gap:6px; margin-bottom:18px; background:#0a0a0a; border-radius:var(--radius); padding:3px;}
  .tab-btn{flex:1; border:none; background:transparent; padding:7px 10px; font-size:13px; border-radius:7px; cursor:pointer; color:var(--text-2); font-family:inherit;}
  .tab-btn.active{background:#2a2a2a; color:var(--text); font-weight:500;}
  .mono-area{font-family:var(--font-mono, monospace); font-size:13px;}
  .folder-list-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:0.5px solid var(--border);}
  .folder-list-row input[type=text]{margin-bottom:0; flex:1;}
  .folder-list-row:last-child{border-bottom:none;}
  code{background:#1f1f1f; padding:1px 5px; border-radius:4px; font-size:12px;}

  /* ---------- IDE-STYLE APP SHELL ---------- */
  .ide-shell{display:flex; flex-direction:column; height:100vh; width:100vw; max-width:100vw; overflow:hidden;}
  .ide-titlebar{
    display:flex; align-items:center; gap:8px; padding:10px 16px; flex-shrink:0;
    background:#0a0a0a; border-bottom:1px solid var(--border); overflow:hidden; min-width:0;
  }
  }
  .titlebar-clock{display:flex; align-items:baseline; gap:8px; flex-shrink:0; white-space:nowrap;}
  .titlebar-clock-time{font-size:14px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0.5px;}
  .titlebar-clock-date{font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .titlebar-search{flex:1; min-width:0; max-width:380px; margin-left:auto; position:relative; display:flex; align-items:center;}
  .titlebar-search i{position:absolute; left:10px; color:var(--text-muted); font-size:13px; pointer-events:none;}
  .titlebar-search input{width:100%; min-width:0; padding:6px 10px 6px 30px; border-radius:6px; border:0.5px solid var(--border-strong); background:#050505; font-size:12px; color:var(--text); font-family:inherit; margin:0; box-sizing:border-box;}
  .titlebar-search input:focus{outline:none; border-color:var(--accent);}
  .ide-lang-switch{display:flex; align-items:center; gap:2px; background:#141414; border:0.5px solid var(--border-strong); border-radius:6px; padding:2px; flex-shrink:0;}
  .ide-lang-btn{padding:3px 9px; font-size:11px; font-weight:600; border:none; border-radius:4px; background:transparent; color:var(--text-muted); cursor:pointer; font-family:inherit;}
  .ide-lang-btn.active{background:var(--accent); color:#001229;}
  .ide-sidebar-toggle{margin-left:10px; padding:5px 8px; display:none; flex-shrink:0;}
  .ide-body{display:flex; flex:1; min-height:0;}
  .ide-sidebar{
    width:230px; flex-shrink:0; background:var(--sidebar-bg); border-right:1px solid var(--border);
    overflow-y:auto; padding:14px 0;
  }
  .ide-sidebar-label{padding:4px 16px 8px; font-size:11px;}
  .ide-main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
  .ide-breadcrumb{
    padding:13px 24px; border-bottom:1px solid var(--border); font-size:12px; color:var(--text-2);
    flex-shrink:0; display:flex; align-items:center; gap:6px;
  }
  .ide-breadcrumb b{color:var(--text); font-weight:600;}
  .ide-content-wrap{flex:1; overflow-y:auto; overflow-x:hidden; padding:22px 24px; min-width:0;}
  .ide-rightpanel{
    width:250px; flex-shrink:0; background:var(--panel-bg); border-left:1px solid var(--border);
    overflow-y:auto; padding:18px 16px;
  }
  .ide-statusbar{
    display:flex; align-items:center; gap:18px; padding:5px 16px; background:#0a0a0a;
    border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); flex-shrink:0; overflow-x:auto; white-space:nowrap;
  }
  .ide-statusbar .sb-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0;}
  .ide-statusbar .sb-sep{margin-left:auto;}
  .ide-statusbar .sb-warn{color:#facc15;} .ide-statusbar .sb-err{color:var(--danger-text);}
  @media (max-width: 860px){
    .ide-sidebar{position:fixed; top:41px; bottom:0; left:0; z-index:6; transform:translateX(-100%); transition:transform .2s; box-shadow:4px 0 16px rgba(0,0,0,0.5);}
    .ide-sidebar.open{transform:translateX(0);}
    .ide-sidebar-toggle{display:block;}
    .ide-rightpanel{
      position:fixed; top:41px; bottom:0; right:0; z-index:6; width:250px; display:block;
      transform:translateX(100%); transition:transform .2s; box-shadow:-4px 0 16px rgba(0,0,0,0.5);
    }
    .ide-rightpanel.open{transform:translateX(0);}
    .ide-rightpanel-toggle{display:block;}
    .ide-statusbar{font-size:10px; gap:12px;}
    .titlebar-search{max-width:110px;}
    .titlebar-clock-date{display:none;}
  }
  .ide-rightpanel-toggle{display:none; margin-left:8px; padding:5px 8px; flex-shrink:0;}

  .side-section{padding:10px 0;}
  .side-section + .side-section{border-top:0.5px solid var(--border); margin-top:10px;}
  .session-section{display:none;}
  .session-section.show{display:block;}
  .session-login{font-size:12px; color:var(--text-2);}

/* =====================================================================
   STORAGE SHIM — works both inside Claude and as a standalone file
   -----------------------------------------------------------------
   The app is written against a `window.storage` API (get/set/delete/
   list, all async) normally provided by the Claude.ai artifact host.
   When this file is downloaded and opened on its own (double-clicked,
   or served by a local web server), that API does not exist — this
   shim recreates the same interface using the browser's built-in
   localStorage, so every storage call in the app works unchanged
   either way. Keys are namespaced under "devic3:" to avoid clashing
   with anything else stored in the same browser profile.
===================================================================== */
if(!window.storage){
  const LS_PREFIX = 'devic3:';
  window.storage = {
    async get(key, shared){
      try{
        const raw = localStorage.getItem(LS_PREFIX + key);
        return raw === null ? null : { key, value: raw, shared: !!shared };
      }catch(e){ console.error('storage.get failed', e); throw e; }
    },
    async set(key, value, shared){
      try{
        localStorage.setItem(LS_PREFIX + key, value);
        return { key, value, shared: !!shared };
      }catch(e){ console.error('storage.set failed', e); return null; }
    },
    async delete(key, shared){
      try{
        localStorage.removeItem(LS_PREFIX + key);
        return { key, deleted: true, shared: !!shared };
      }catch(e){ console.error('storage.delete failed', e); return null; }
    },
    async list(prefix, shared){
      try{
        const keys = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(!k || !k.startsWith(LS_PREFIX)) continue;
          const bare = k.slice(LS_PREFIX.length);
          if(!prefix || bare.startsWith(prefix)) keys.push(bare);
        }
        return { keys, prefix, shared: !!shared };
      }catch(e){ console.error('storage.list failed', e); return null; }
    }
  };
}

// Groups a credential account's fields into up to 3 compact, scannable rows:
//   1) UID/User/Email + Pass + Tên
//   2) Email + Pass Email (whichever email/password pair actually has data)
//   3) Proxy + mã 2FA (mã trực tiếp, đã giải — không phải secret thô)
// Anything left over (secondaryEmail when unused above, cookie, token, khác...)
// is returned separately so it can go in a small collapsible "extra" section
// instead of cluttering the main view.
function buildEntryDisplayRows(e){
  const rows = [];
  const used = new Set(['fbName']);

  const row1 = [];
  const primaryLabel = (e.platform === 'gmail' || e.platform === 'hotmail')
    ? 'Email'
    : ((e.platform === 'tiktok' || e.platform === 'steam') ? 'User' : 'UID');
  row1.push({ label: primaryLabel, field: 'fbName', value: e.fbName, secret: false });
  if(e.password){ row1.push({ label: 'Pass', field: 'password', value: e.password, secret: true }); used.add('password'); }
  if(e.displayName){ row1.push({ label: 'Tên', field: 'displayName', value: e.displayName, secret: false }); used.add('displayName'); }
  rows.push(row1);

  const row2 = [];
  if(e.email){
    row2.push({ label: 'Email', field: 'email', value: e.email, secret: false });
    used.add('email');
    if(e.emailPassword){ row2.push({ label: 'Pass Email', field: 'emailPassword', value: e.emailPassword, secret: true }); used.add('emailPassword'); }
  } else if(e.secondaryEmail){
    row2.push({ label: 'Email phụ', field: 'secondaryEmail', value: e.secondaryEmail, secret: false });
    used.add('secondaryEmail');
    if(e.secondaryEmailPassword){ row2.push({ label: 'Pass', field: 'secondaryEmailPassword', value: e.secondaryEmailPassword, secret: true }); used.add('secondaryEmailPassword'); }
  }
  if(row2.length) rows.push(row2);

  const row3 = [];
  if(e.proxy){ row3.push({ label: 'Proxy', field: 'proxy', value: e.proxy, secret: false }); used.add('proxy'); }
  if(e.twoFA){
    // Steam Guard does not use the ordinary six-digit RFC TOTP calculation.
    // Keep its saved value masked/copyable instead of showing a misleading code.
    if(e.platform === 'steam') row3.push({ label: '2FA / Steam Guard', field: 'twoFA', value: e.twoFA, secret: true });
    else row3.push({ label: '2FA', field: 'twoFA', value: null, secret: false, isTotp: true });
    used.add('twoFA');
  }
  if(e.platform === 'facebook' || e.platform === 'hotmail') row3.push({ isMailOtpAction: true });
  if(e.phone){ row3.push({ label: 'SĐT', field: 'phone', value: e.phone, secret: false }); used.add('phone'); }
  if(row3.length) rows.push(row3);

  return { rows, used };
}

function platformDelimiter(platformId){

  const d = platformDelimiter(platformId);

  const d = platformDelimiter(platformId);

  return PLATFORM_FIELDS[platformId] || PLATFORM_FIELDS.facebook;

function getPlatformInputFields(platformId){
  const fields = getPlatformFields(platformId);
  const byKey = new Map(fields.map(f => [f.key, f]));
  const ordered = (PLATFORM_INPUT_ORDER[platformId] || []).map(key => byKey.get(key)).filter(Boolean);

// phone number expiry helper: how many days left until a phone's "Ngày hết hạn" (expiry) date
// accepts both the native date-picker format (YYYY-MM-DD) and Vietnamese-style DD/MM/YYYY
// (as typically typed when pasting via the "Tự động" bulk-import tab)
function parseFlexibleDate(str){
  if(!str) return null;
  let m = String(str).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = String(str).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return new Date(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
// Always show/store dates as dd/mm/yyyy in the UI (Vietnamese convention) — the
// native <input type="date"> widget renders in the OS/browser locale format
// (often mm/dd/yyyy) which we can't reliably override, so date fields use a
// plain text input with this fixed display format instead.
function formatDateDMY(dateObj){
  const dd = String(dateObj.getDate()).padStart(2, '0');
  const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
  const yyyy = dateObj.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}
// "MỚI" badge for accounts added less than 24h ago — purely a display check
// against the stored createdAt timestamp, so it naturally stops showing on
// its own once 24h have passed (re-evaluated on every render, no timer needed).
const NEW_BADGE_WINDOW_MS = 24 * 60 * 60 * 1000;
function isNewEntry(e){
  if(!e.createdAt) return false;
  return (Date.now() - e.createdAt) < NEW_BADGE_WINDOW_MS;
}
function toDisplayDate(raw){
  if(!raw) return '';
  const d = parseFlexibleDate(raw);
  return d ? formatDateDMY(d) : raw;
}

function backupFileName(ext){
  const now = new Date();
  return `Backup${now.getDate()}-${now.getMonth() + 1}.${ext}`;
}
function phoneExpiryInfo(expiryDateStr){
  if(!expiryDateStr) return null;
  const exp = parseFlexibleDate(expiryDateStr);
  if(!exp) return null;
  const now = new Date();
  now.setHours(0,0,0,0);
  exp.setHours(0,0,0,0);
  const diffDays = Math.round((exp - now) / 86400000);
  if(diffDays < 0) return { label: `Hết hạn ${Math.abs(diffDays)} ngày trước`, color: '#f87171', bg: 'rgba(248,113,113,0.16)', diffDays };
  if(diffDays === 0) return { label: 'Hết hạn hôm nay', color: '#f87171', bg: 'rgba(248,113,113,0.16)', diffDays };
  if(diffDays === 1) return { label: 'Còn 1 ngày', color: '#facc15', bg: 'rgba(250,204,21,0.16)', diffDays };
  return { label: `Còn ${diffDays} ngày`, color: '#4ade80', bg: 'rgba(74,222,128,0.14)', diffDays };
}
function phoneExpiryBadgeHtml(e){
  if((e.platform !== 'phone' && e.platform !== 'proxy') || !e.expiryDate) return '';
  const info = phoneExpiryInfo(e.expiryDate);
  if(!info) return '';
  return `<span class="status-badge" style="color:${info.color};background:${info.bg};" title="Ngày hết hạn: ${escapeHtml(toDisplayDate(e.expiryDate))}"><i class="ti ti-calendar-due" style="font-size:11px;vertical-align:-1px"></i> ${escapeHtml(info.label)}</span>`;
}

function b64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function unb64(str){
  const bin = atob(str);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}

// PBKDF2 iteration count — OWASP's 2023 minimum recommendation for
// PBKDF2-HMAC-SHA256 is 600,000; new vaults use this. Vaults created before
// this security upgrade used 250,000 — their own iteration count is stored in
// their config and honored on unlock so existing vaults keep working exactly
// as before (no forced re-encryption, no risk of locking anyone out).
const PBKDF2_ITERATIONS = 600000;
const PBKDF2_ITERATIONS_LEGACY = 250000;

async function deriveKey(password, saltB64, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: unb64(saltB64), iterations: iterations || PBKDF2_ITERATIONS, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    true, // extractable — required so the optional "keep session across F5" feature can persist the derived key
    ['encrypt','decrypt']
  );
}

// ---------- OPTIONAL: keep session across page reload (F5) ----------
// Off by default. The derived AES key never touches localStorage/disk — it's
// exported to sessionStorage only, which the browser wipes the moment the tab
// is actually closed (unlike localStorage, which survives indefinitely).
// This trades a bit of security for convenience: while the key sits in
// sessionStorage, anyone with access to this exact browser tab (devtools, a
// malicious extension, someone sitting at an unlocked/unattended computer)
// could read it and unlock the vault without the password. Locking (manually
// or via the 30-minute idle timeout) always wipes it immediately, so a proper
// "Khoá" still really locks things even with this feature turned on.
const STORAGE_KEEP_SESSION_PREF_KEY = 'devic3-keep-session';
const SESSION_KEY_STORAGE_KEY = 'devic3-session-key';

async function getKeepSessionPref(){
  try{
    const res = await window.storage.get(STORAGE_KEEP_SESSION_PREF_KEY, false);
    return !!(res && res.value === '1');
  }catch(e){ return false; }
}
async function setKeepSessionPref(on){
  try{ await window.storage.set(STORAGE_KEEP_SESSION_PREF_KEY, on ? '1' : '0', false); }catch(e){}
}
async function persistSessionKey(key, saltB64){
  try{
    const raw = await crypto.subtle.exportKey('raw', key);
    sessionStorage.setItem(SESSION_KEY_STORAGE_KEY, JSON.stringify({ key: b64(new Uint8Array(raw)), salt: saltB64 }));
  }catch(e){ console.error(e); }
}
function clearPersistedSessionKey(){
  try{ sessionStorage.removeItem(SESSION_KEY_STORAGE_KEY); }catch(e){}
}
async function tryRestoreSessionKey(expectedSaltB64){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed.salt !== expectedSaltB64) return null; // belongs to a different vault — don't reuse
    const keyBytes = unb64(parsed.key);
    return await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
  }catch(e){ return null; }
}

async function encryptStr(key, plaintext){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plaintext));
  return { iv: b64(iv), data: b64(cipher) };
}
async function decryptStr(key, blob){
  if(!blob || typeof blob.iv !== 'string' || typeof blob.data !== 'string'){
    throw new Error('Dữ liệu mã hoá không đúng định dạng.');
  }
  const dec = new TextDecoder();
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(blob.iv)}, key, unb64(blob.data));
  return dec.decode(plain);
}

function encryptedBlobLooksValid(blob){
  return !!blob && typeof blob === 'object' && typeof blob.iv === 'string' && typeof blob.data === 'string';
}

function configLooksValid(config){
  if(!config || typeof config.salt !== 'string' || !encryptedBlobLooksValid(config.verifier)) return false;
  if(config.iterations !== undefined && (!Number.isInteger(config.iterations) || config.iterations < 10000 || config.iterations > 10000000)) return false;
  try{
    return unb64(config.salt).byteLength >= 16 && unb64(config.verifier.iv).byteLength === 12 && unb64(config.verifier.data).byteLength > 16;
  }catch(e){
    return false;
  }
}

async function readStoredRaw(key){
  const res = await window.storage.get(key);
  return res && typeof res.value === 'string' ? res.value : null;
}

async function writeStoredRaw(key, value){
  if(value === null || value === undefined){
    const result = await window.storage.delete(key, false);
    if(!result) throw new Error(`Không thể xoá dữ liệu ${key}.`);
    return;
  }
  const result = await storageSetWithRetry(key, value);
  if(!result) throw new Error(`Không thể ghi dữ liệu ${key}.`);
}

// Replaces all encrypted vault records as one logical transaction. localStorage
// has no native transactions, so every previous value is snapshotted and restored
// if any write fails. This prevents a half-old/half-new vault.
async function replaceStoredVault(rawValues){
  const keys = [STORAGE_CONFIG_KEY, STORAGE_DATA_KEY, STORAGE_FOLDERS_KEY, STORAGE_NOTES_KEY];
  const before = {};
  for(const key of keys) before[key] = await readStoredRaw(key);
  try{
    for(const key of keys) await writeStoredRaw(key, rawValues[key] ?? null);
  }catch(error){
    const rollbackErrors = [];
    for(const key of keys){
      try{ await writeStoredRaw(key, before[key]); }
      catch(rollbackError){ rollbackErrors.push(rollbackError); }
    }
    if(rollbackErrors.length) throw new Error('Ghi kho thất bại và không thể khôi phục đầy đủ dữ liệu cũ. Hãy tải lại trang và dùng file sao lưu gần nhất.');
    throw error;
  }
}

async function buildEncryptedVaultRaw(config, key, entries, folders, notes){
  const [entriesBlob, foldersBlob, notesBlob] = await Promise.all([
    encryptStr(key, JSON.stringify(entries)),
    encryptStr(key, JSON.stringify(folders)),
    encryptStr(key, JSON.stringify(notes)),
  ]);
  return {
    [STORAGE_CONFIG_KEY]: JSON.stringify(config),
    [STORAGE_DATA_KEY]: JSON.stringify(entriesBlob),
    [STORAGE_FOLDERS_KEY]: JSON.stringify(foldersBlob),
    [STORAGE_NOTES_KEY]: JSON.stringify(notesBlob),
  };
}

    if(!configLooksValid(config)) throw new Error('Cấu hình kho lưu trữ bị hỏng hoặc không đúng định dạng.');

    return config;

async function loadEntries(){
  const res = await window.storage.get(STORAGE_DATA_KEY);
  if(res && res.value){
    try{
      const blob = JSON.parse(res.value);
      const json = await decryptStr(state.key, blob);
      state.entries = JSON.parse(json);
      if(!Array.isArray(state.entries)) throw new Error('Danh sách tài khoản không hợp lệ.');
      state.entries.forEach(e => { if(!e.platform) e.platform = 'facebook'; });
      // one-time migration: accounts saved before "ngày nhập tài khoản" existed
      // don't have a createdAt — best available fallback is their updatedAt
      // (or now, if even that's missing), so the date shown is never blank.
      let migratedDates = false;
      state.entries.forEach(e => {
        if(!e.createdAt){ e.createdAt = e.updatedAt || Date.now(); migratedDates = true; }
      });
      // one-time auto-repair: fix Facebook accounts whose Email field actually
      // holds a cookie/token dump (or an email/2FA/UID that landed in the wrong
      // column) from a previous bad paste, so old broken entries self-heal too.
      let repaired = false;
      state.entries.forEach(e => {
        if(e.platform !== 'facebook') return;
        const before = JSON.stringify([e.fbName, e.twoFA, e.email, e.secondaryEmail, e.cookie]);
        Object.assign(e, smartCorrectFacebookFields(e));
        const after = JSON.stringify([e.fbName, e.twoFA, e.email, e.secondaryEmail, e.cookie]);
        if(before !== after) repaired = true;
      });
      // one-time auto-repair: Gmail didn't have a dedicated 2FA field until
      // now — anyone who pasted a 2FA secret before this update had it land
      // in "Email phụ" instead (the next column over). If that field holds
      // something 2FA-secret-shaped rather than a real email, move it over.
      let gmailRepaired = false;
      state.entries.forEach(e => {
        if(e.platform !== 'gmail') return;
        if(!e.twoFA && e.secondaryEmail && !looksLikeEmail(e.secondaryEmail) && looksLike2FASecret(e.secondaryEmail)){
          e.twoFA = e.secondaryEmail;
          e.secondaryEmail = '';
          gmailRepaired = true;
        }
      });
      if(repaired || gmailRepaired || migratedDates){
        if(!await saveEntries()) throw new Error('Không thể lưu dữ liệu sau khi nâng cấp định dạng.');
        const repairMsgs = [];
        if(repaired) repairMsgs.push('dữ liệu bị lệch cột (email/cookie)');
        if(gmailRepaired) repairMsgs.push('mã 2FA Gmail bị lệch ô');
        if(repairMsgs.length) toast('Đã tự động sửa: ' + repairMsgs.join(', '));
      }
      return;
    }catch(e){
      throw new Error('Không thể đọc dữ liệu tài khoản đã mã hoá. Kho có thể bị hỏng; dữ liệu chưa bị ghi đè.', { cause: e });
    }
  }
  state.entries = [];
}

// ---------- ON-DISK FILE BACKUP (File System Access API — Chrome/Edge) ----------
// Lets the vault live in one file the person picks on their own hard drive, instead
// of only inside the browser's storage. That file can be copied to a USB drive,
// synced folder, or opened directly on a different computer to log back in —
// so a Windows reinstall / cleared browser data doesn't mean losing everything.
function fileSystemAccessSupported(){
  return typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
}

async function assembleVaultBundle(){
  const configRes = await window.storage.get(STORAGE_CONFIG_KEY);
  const entriesRes = await window.storage.get(STORAGE_DATA_KEY);
  const foldersRes = await window.storage.get(STORAGE_FOLDERS_KEY);
  const notesRes = await window.storage.get(STORAGE_NOTES_KEY);
  return {
    app: 'devic3',
    version: 2,
    savedAt: Date.now(),
    config: configRes && configRes.value ? JSON.parse(configRes.value) : null,
    entries: entriesRes && entriesRes.value ? JSON.parse(entriesRes.value) : null,
    folders: foldersRes && foldersRes.value ? JSON.parse(foldersRes.value) : null,
    notes: notesRes && notesRes.value ? JSON.parse(notesRes.value) : null,
  };
}

let vaultFileWriteQueue = Promise.resolve();
function writeVaultFile(){
  // FileSystemWritableFileStream instances must not overlap. Queue writes so
  // rapid edits cannot race and truncate/corrupt the linked backup file.
  vaultFileWriteQueue = vaultFileWriteQueue.catch(() => {}).then(async () => {
    const handle = state.fileHandle;
    if(!handle) return true;
    try{
      const bundle = await assembleVaultBundle();
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(bundle, null, 2));
      await writable.close();
      return true;
    }catch(e){
      console.error(e);
      toast('⚠ Không ghi được vào file trên ổ cứng — dữ liệu vẫn an toàn trong trình duyệt');
      return false;
    }
  });
  return vaultFileWriteQueue;
}

// Links a NEW file to mirror whatever vault is *currently open* (does not
// touch the vault's data or password — for someone who just wants an existing
// vault to also start writing to a file going forward).
async function linkNewVaultFile(){
  if(!fileSystemAccessSupported()){
    toast('Trình duyệt này không hỗ trợ lưu trực tiếp ra file (chỉ Chrome/Edge trên máy tính — không dùng được trên Safari/iPad). Hãy dùng "Nhập/Xuất" để sao lưu thủ công thay thế.');
    return false;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: backupFileName('json'),
      types: [{ description: 'Devic3 Vault', accept: { 'application/json': ['.json'] } }]
    });
    state.fileHandle = handle;
    state.fileHandleName = handle.name;
    if(!await writeVaultFile()){
      state.fileHandle = null;
      state.fileHandleName = '';
      return false;
    }
    return true;
  }catch(e){
    if(e.name !== 'AbortError'){ console.error(e); toast('Không thể tạo file'); }
    return false;
  }
}

// Opens an EXISTING vault file and fully loads it — cleanly replacing whatever
// vault/session is currently active, then always landing on the Unlock screen
// for that file's password (this used to silently patch localStorage without
// updating what was on screen, which looked like "nothing happened").
// Shared by both the File-System-Access "open file" flow (Chrome/Edge only)
// AND the universal file-input flow (works everywhere, including Safari) —
// takes an already-parsed bundle and switches the app over to it.
async function applyVaultBundleAndSwitch(bundle, sourceName){
  const configValid = bundle && configLooksValid(bundle.config);
  const blobsValid = ['entries', 'folders', 'notes'].every(name => bundle[name] == null || encryptedBlobLooksValid(bundle[name]));
  if(!bundle || bundle.app !== 'devic3' || !configValid || !blobsValid){
    toast('File không đúng định dạng kho Devic3');
    return false;
  }
  try{
    await replaceStoredVault({
      [STORAGE_CONFIG_KEY]: JSON.stringify(bundle.config),
      [STORAGE_DATA_KEY]: bundle.entries == null ? null : JSON.stringify(bundle.entries),
      [STORAGE_FOLDERS_KEY]: bundle.folders == null ? null : JSON.stringify(bundle.folders),
      [STORAGE_NOTES_KEY]: bundle.notes == null ? null : JSON.stringify(bundle.notes),
    });
  }catch(e){
    console.error(e);
    toast('Không thể nhập file; kho hiện tại đã được giữ nguyên');
    return false;
  }

  state.key = null;
  state.entries = [];
  state.folders = [];
  state.notes = [];
  endSession();

  closeModal();
  toast(sourceName ? `Đã nhập "${sourceName}" — nhập mật khẩu chính để mở khoá` : 'Đã nhập file sao lưu — nhập mật khẩu chính để mở khoá');
  renderUnlock(bundle.config);
  return true;
}

async function openExistingVaultFileAndSwitch(){
  if(!fileSystemAccessSupported()){
    toast('Trình duyệt này không hỗ trợ mở file trực tiếp (chỉ Chrome/Edge trên máy tính — không dùng được trên Safari/iPad). Hãy dùng "Đã có kho lưu trữ? Khôi phục từ file sao lưu" thay thế.');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Devic3 Vault', accept: { 'application/json': ['.json'] } }]
    });
    const file = await handle.getFile();
    const text = await file.text();
    const bundle = JSON.parse(text);
    const ok = await applyVaultBundleAndSwitch(bundle, handle.name);
    if(ok){
      state.fileHandle = handle;
      state.fileHandleName = handle.name;
    }
  }catch(e){
    if(e.name !== 'AbortError'){ console.error(e); toast('Không thể mở file — kiểm tra lại đúng file kho chưa'); }
  }
}

// ---------- UNIVERSAL encrypted backup (.json) — works on every browser,
// including Safari/iOS where the File System Access API above doesn't exist
// at all. Same encrypted bundle format, just exported/imported via a plain
// download link and <input type="file"> instead of native file pickers, so
// PC and iPhone can use the exact same backup file interchangeably. ----------
async function exportEncryptedBackupUniversal(){
  try{
    const bundle = await assembleVaultBundle();
    const json = JSON.stringify(bundle);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = backupFileName('json');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã tải file sao lưu mã hoá — dùng được để nhập lại trên mọi thiết bị');
  }catch(e){
    console.error(e);
    toast('Không thể tạo file sao lưu, thử lại');
  }
}

function openImportEncryptedBackupUniversal(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async () => {
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if(!file) return;
    try{
      const text = await file.text();
      const bundle = JSON.parse(text);
      await applyVaultBundleAndSwitch(bundle, file.name);
    }catch(e){
      console.error(e);
      toast('Không đọc được file — kiểm tra lại đúng file sao lưu .json chưa');
    }
  };
  input.click();
}

// small debounce helper — avoids a full list re-render on every single keystroke
// while typing in the search box, which was the main source of noticeable lag
// on accounts with a large number of entries.
function debounce(fn, wait){
  let t = null;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

// The search box lives permanently in the title bar now (not inside #app),
// so it survives every re-render untouched — no more losing focus/cursor
// position on each keystroke like when it used to get destroyed and
// recreated inside the scrollable content area. `context` is 'accounts',
// 'notes', or null (hides the box entirely — locked screens, Tools tab).
function syncGlobalSearchBar(context){
  const wrap = document.getElementById('titlebarSearchWrap');
  const input = document.getElementById('globalSearchInput');
  if(!wrap || !input) return;
  if(!context){
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'flex';
  input.placeholder = context === 'notes' ? t('placeholder_search_notes') : t('placeholder_search');
  if(document.activeElement !== input && input.value !== state.search) input.value = state.search;
  input.oninput = debounce((e) => {
    state.search = e.target.value;
    if(context === 'notes') renderNotesVault();
    else renderVault();
  }, 180);
}

// small retry helper — storage.set can occasionally fail transiently (e.g. a
// brief hiccup in the host's storage backend); retries once after a short
// delay before giving up, since a single retry resolves most transient blips
// without making the user re-type their password.
async function storageSetWithRetry(key, value){
  try{
    const result = await window.storage.set(key, value);
    if(result) return result;
  }catch(e){}
  await new Promise(r => setTimeout(r, 400));
  return window.storage.set(key, value);
}

async function commitCollection(property, nextValue, saveFn){
  const previousValue = state[property];
  state[property] = nextValue;
  const saved = await saveFn();
  if(!saved){
    state[property] = previousValue;
    return false;
  }
  return true;
}

async function commitCollections(changes){
  const previous = {};
  for(const change of changes){
    previous[change.property] = state[change.property];
    state[change.property] = change.nextValue;
  }
  const savedChanges = [];
  for(const change of changes){
    if(await change.saveFn()){
      savedChanges.push(change);
      continue;
    }
    for(const item of changes) state[item.property] = previous[item.property];
    for(const saved of savedChanges) await saved.saveFn();
    return false;
  }
  return true;
}

// Updates the breadcrumb + bottom status bar with real, live info (current tab,
// duplicate-account count, accounts nearing expiry) — not just decorative text.
function updateIdeChrome(){
  const breadcrumb = document.getElementById('ideBreadcrumb');
  if(breadcrumb){
    const label = state.activePlatform === 'other' ? t('platform_tools') : platformMeta(state.activePlatform).name;
    breadcrumb.innerHTML = `<i class="ti ti-chevron-right" style="font-size:12px;"></i> <b>Devic3</b> <span style="color:var(--text-muted);">/</span> ${escapeHtml(label)}`;
  }
  const bar = document.getElementById('ideStatusBar');
  if(!bar) return;
  if(!state.key){
    bar.innerHTML = `<span><span class="sb-dot" style="background:var(--text-muted);"></span>${t('status_locked')}</span><span class="sb-sep">AES-256-GCM · PBKDF2</span>`;
    return;
  }
  // Everything below is scoped to the CURRENT tab only — switching tabs shows
  // that tab's own numbers, not a running total across the whole vault.
  const isNote = state.activePlatform === 'note';
  const isTools = state.activePlatform === 'other';
  const platformEntries = isNote || isTools ? [] : state.entries.filter(e => e.platform === state.activePlatform);

  let dupCount = 0;
  if(!isNote && !isTools){
    dupCount = findAllDuplicateGroups(state.activePlatform).reduce((s, g) => s + (g.list.length - 1), 0);
  }
  let expiringCount = 0;
  platformEntries.forEach(e => {
    if((e.platform === 'phone' || e.platform === 'proxy') && e.expiryDate){
      const info = phoneExpiryInfo(e.expiryDate);
      if(info && info.diffDays >= 0 && info.diffDays <= 1) expiringCount++;
    }
  });
  const countLabel = isNote ? state.notes.length + ' ' + t('comment_notes').replace('// ', '')
    : isTools ? ''
    : `${platformEntries.length} ${t('status_accounts')}`;

  bar.innerHTML = `
    <span><span class="sb-dot" style="background:#4ade80;"></span>${t('status_unlocked')}</span>
    <span>~/devic3/${escapeHtml(state.activePlatform)}</span>
    ${!isNote && !isTools ? `<span class="${dupCount>0?'sb-err':''}"><i class="ti ti-copy-check" style="font-size:11px;vertical-align:-1px;"></i> ${dupCount} ${t('status_duplicates')}</span>` : ''}
    ${!isNote && !isTools ? `<span class="${expiringCount>0?'sb-warn':''}"><i class="ti ti-clock-exclamation" style="font-size:11px;vertical-align:-1px;"></i> ${expiringCount} ${t('status_expiring')}</span>` : ''}
    <span class="sb-sep">${countLabel}${countLabel ? ' · ' : ''}AES-256</span>
  `;
}

      }
      const saltBuf = crypto.getRandomValues(new Uint8Array(16));
      const saltB64 = b64(saltBuf);
      const key = await deriveKey(pw1, saltB64, PBKDF2_ITERATIONS);
      const verifier = await encryptStr(key, VERIFY_STRING);
      const config = {salt: saltB64, verifier, iterations: PBKDF2_ITERATIONS};
      const defaultFolders = [
        { id: uid(), name: 'Tài khoản mới', platformId: 'facebook' },
        { id: uid(), name: 'Tài khoản cũ', platformId: 'facebook' }
      ];
      const rawVault = await buildEncryptedVaultRaw(config, key, [], defaultFolders, []);
      await replaceStoredVault(rawVault);
      state.key = key;
      const keepChecked = !!(document.getElementById('keepSessionCheckSetup') || {}).checked;
      await setKeepSessionPref(keepChecked);
      if(keepChecked) await persistSessionKey(key, saltB64);
      state.entries = [];
      state.folders = defaultFolders;
      state.notes = [];
      startSession();
      renderVault();
    }catch(e){
      console.error(e);
      err.textContent = 'Tạo kho lưu trữ thất bại: ' + (e.message || 'lỗi không xác định.');
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Tạo kho lưu trữ';
    }
  };
}

// ---------- RESTORE FROM EXPORTED BACKUP TEXT ----------
// Parses the .txt produced by "Xuất" (buildExportContent) back into entries/folders.
// Lets someone whose local storage looks empty (new device, fresh download, cleared
// browser data...) get back into a vault they already have a backup file for.
function parseBackupLine(line, platformId){
  const fields = getPlatformFields(platformId);
  const delim = platformDelimiter(platformId);
  let baseFields, suffixParts;
  if(delim === '|'){
    const parts = line.split('|');
    // Text backups include three trailing metadata columns. Detect backups made
    // before the new security fields were appended so Folder/Name/Proxy do not shift.
    const historicFieldCounts = { facebook: [9], gmail: [6], tiktok: [9], hotmail: [6, 11], steam: [6] };
    const possibleLegacyCount = parts.length - 3;
    const baseCount = (historicFieldCounts[platformId] || []).includes(possibleLegacyCount)
      ? possibleLegacyCount
      : fields.length;
    baseFields = parts.slice(0, baseCount);
    suffixParts = parts.slice(baseCount);
  } else {
    const pipeParts = line.split('|');
    baseFields = (pipeParts[0] || '').split(delim);
    suffixParts = pipeParts.slice(1);
  }
  const obj = {};
  fields.forEach((f, i) => { obj[f.key] = (baseFields[i] || '').trim(); });
  obj.__folderName = (suffixParts[0] || '').trim();
  obj.displayName = (suffixParts[1] || '').trim();
  obj.proxy = (suffixParts[2] || '').trim();
  return obj;
}

function parseBackupText(text){
  const platformNameToId = {};
  PLATFORMS.forEach(p => { platformNameToId[p.name] = p.id; });
  let currentPlatformId = null;
  const results = [];
  text.split('\n').forEach(raw => {
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('##')){
      const m = line.match(/^##\s*([^(]+)/);
      currentPlatformId = m ? (platformNameToId[m[1].trim()] || null) : null;
      return;
    }
    if(line.startsWith('#')) return;
    if(!currentPlatformId) return;
    const parsed = parseBackupLine(line, currentPlatformId);
    if(parsed.fbName || parsed.email){
      results.push({ platformId: currentPlatformId, fields: parsed });
    }
  });
  return results;
}

async function resolveFolderId(platformId, folderNameStr){
  if(!folderNameStr) return '';
  let f = state.folders.find(x => x.platformId === platformId && x.name === folderNameStr);
  if(!f){
    f = { id: uid(), name: folderNameStr, platformId };
    state.folders.push(f);
  }
  return f.id;
}

async function deleteEntireVault(){
  try{
    await replaceStoredVault({
      [STORAGE_CONFIG_KEY]: null,
      [STORAGE_DATA_KEY]: null,
      [STORAGE_FOLDERS_KEY]: null,
      [STORAGE_NOTES_KEY]: null,
    });
    // The preference contains no vault data. Failure to remove it must not turn
    // a successfully deleted vault into a misleading "delete failed" result.
    await window.storage.delete(STORAGE_KEEP_SESSION_PREF_KEY, false);
  }catch(e){
    console.error(e);
    toast('Không thể xoá kho; dữ liệu hiện tại được giữ nguyên');
    return false;
  }
  clearPersistedSessionKey();
  state.key = null;
  state.entries = [];
  state.folders = [];
  state.notes = [];
  state.fileHandle = null;
  state.fileHandleName = null;
  endSession();
  return true;
}

  `;
  modalBg.classList.add('show');
  document.getElementById('restoreCancelBtn').onclick = closeModal;
  document.getElementById('restoreSubmitBtn').onclick = async () => {
    const btn = document.getElementById('restoreSubmitBtn');
    const err = document.getElementById('restoreErr');
    err.style.display = 'none';
    const text = document.getElementById('restoreText').value;
    const pw1 = document.getElementById('restorePw1').value;
    const pw2 = document.getElementById('restorePw2').value;
    if(!text.trim()){
      err.textContent = 'Dán nội dung file sao lưu vào ô trên.';
      err.style.display = 'block';
      return;
    }
    if(pw1.length < 6){
      err.textContent = 'Mật khẩu cần ít nhất 6 ký tự.';
      err.style.display = 'block';
      return;
    }
    if(pw1 !== pw2){
      err.textContent = 'Hai mật khẩu không khớp nhau.';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Đang khôi phục...';
    try{
      if(!window.storage || typeof window.storage.set !== 'function'){
        throw new Error('Không tìm thấy bộ nhớ lưu trữ (window.storage) trong trình duyệt này.');
      }
      const parsedList = parseBackupText(text);
      if(parsedList.length === 0){
        throw new Error('Không đọc được tài khoản nào từ nội dung đã dán. Kiểm tra lại đã copy đủ nội dung file chưa.');
      }
      const saltBuf = crypto.getRandomValues(new Uint8Array(16));
      const saltB64 = b64(saltBuf);
      const key = await deriveKey(pw1, saltB64, PBKDF2_ITERATIONS);
      const verifier = await encryptStr(key, VERIFY_STRING);
      const config = {salt: saltB64, verifier, iterations: PBKDF2_ITERATIONS};
      const nextFolders = [];
      const nextNotes = [];
      const nextEntries = [];
      for(const item of parsedList){
        const folderName = item.fields.__folderName;
        let folderId = '';
        if(folderName){
          let folder = nextFolders.find(x => x.platformId === item.platformId && x.name === folderName);
          if(!folder){
            folder = { id: uid(), name: folderName, platformId: item.platformId };
            nextFolders.push(folder);
          }
          folderId = folder.id;
        }
        const fields = { ...item.fields };
        delete fields.__folderName;
        fields.platform = item.platformId;
        fields.folderId = folderId;
        fields.updatedAt = Date.now();
        fields.createdAt = Date.now();
        nextEntries.push({ id: uid(), ...fields });
      }
      const rawVault = await buildEncryptedVaultRaw(config, key, nextEntries, nextFolders, nextNotes);
      await replaceStoredVault(rawVault);
      state.key = key;
      state.entries = nextEntries;
      state.folders = nextFolders;
      state.notes = nextNotes;
      startSession();
      closeModal();
      renderVault();
      toast(`Đã khôi phục ${parsedList.length} tài khoản từ bản sao lưu`);
    }catch(e){
      console.error(e);
      err.textContent = 'Khôi phục thất bại: ' + (e.message || 'lỗi không xác định.');
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Khôi phục';
    }
  };
}

function renderUnlock(config){
  renderLockedShellChrome('unlock');
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="lock-wrap">
      <div class="lock-icon"><i class="ti ti-lock"></i></div>
      <div class="code-comment" style="font-size:12px; margin-bottom:14px;">${t('unlock_comment')}</div>
      <div class="center-form">
        <label>${t('label_master_pw')}</label>
        <input type="password" id="pwUnlock" placeholder="${t('placeholder_enter_pw')}">
        <p class="err" id="unlockErr"></p>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:400; margin:-4px 0 4px;">
          <input type="checkbox" id="keepSessionCheck">
          <span>${t('keep_session_label')}</span>
        </label>
        <p class="hint" style="margin:0 0 16px;">${t('keep_session_hint')}</p>
        <button class="primary" id="unlockBtn" style="width:100%">${t('btn_unlock')}</button>
        <button type="button" id="deleteVaultLink" style="width:100%; margin-top:16px; background:transparent; border:none; color:var(--text-muted); font-size:12px; text-decoration:underline; cursor:pointer; padding:4px;">Quên mật khẩu? Xoá kho hiện tại và tạo kho mới</button>
      </div>
    </div>
  `;
  getKeepSessionPref().then(on => {
    const cb = document.getElementById('keepSessionCheck');
    if(cb) cb.checked = on;
  });
  document.getElementById('deleteVaultLink').onclick = openDeleteVaultModal;
  const doUnlock = async () => {
    const btn = document.getElementById('unlockBtn');
    const pw = document.getElementById('pwUnlock').value;
    const err = document.getElementById('unlockErr');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang mở...';
    let key;
    try{
      // honor the vault's own stored iteration count — older vaults (created
      // before the PBKDF2 security upgrade) still used a lower count, and
      // must keep using it or the derived key won't match at all
      key = await deriveKey(pw, config.salt, config.iterations || PBKDF2_ITERATIONS_LEGACY);
      const check = await decryptStr(key, config.verifier);
      if(check !== VERIFY_STRING) throw new Error('WRONG_PASSWORD');
    }catch(e){
      err.textContent = 'Sai mật khẩu, thử lại.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Mở khoá';
      return;
    }
    try{
      state.key = key;
      const keepChecked = !!(document.getElementById('keepSessionCheck') || {}).checked;
      await setKeepSessionPref(keepChecked);
      if(keepChecked) await persistSessionKey(key, config.salt);
      else clearPersistedSessionKey();
      await loadEntries();
      await loadFolders();
      await loadNotes();
      startSession();
      renderVault();
    }catch(e){
      console.error(e);
      state.key = null;
      err.textContent = 'Mở khoá thất bại: ' + (e.message || 'không đọc được dữ liệu đã lưu.');
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Mở khoá';
    }
  };
  document.getElementById('unlockBtn').onclick = doUnlock;
  document.getElementById('pwUnlock').addEventListener('keydown', e => { if(e.key === 'Enter') doUnlock(); });
}

function folderName(id){
  if(!id) return null;
  const f = state.folders.find(x => x.id === id);
