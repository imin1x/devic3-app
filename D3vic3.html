            ? `<p class="entry-id"><i class="ti ti-plug" style="font-size:13px;vertical-align:-1px"></i> Port: <span class="copy-inline" data-copy-field="port" title="Bấm để sao chép port">${escapeHtml(e.port || '—')}</span>${e.username ? ` <span style="color:var(--text-muted);">| User:</span> <span class="copy-inline" data-copy-field="username" title="Bấm để sao chép user">${escapeHtml(e.username)}</span>` : ''}${e.password ? ` <span style="color:var(--text-muted);">| Pass:</span> <span class="copy-inline" data-copy-field="password" style="font-family:var(--mono); letter-spacing:2px;" title="Bấm để sao chép mật khẩu">••••••••</span>` : ''}</p>`
            : ''}
          <div class="entry-meta-row">
            ${folderName(e.folderId) ? `<span class="entry-folder"><i class="ti ti-folder" style="font-size:11px;vertical-align:-1px"></i> ${escapeHtml(folderName(e.folderId))}</span>` : ''}
            ${isPhoneOrProxy ? phoneExpiryBadgeHtml(e) : `<span class="status-badge" style="color:${statusMeta(displayedStatus).color};background:${statusMeta(displayedStatus).bg};" title="Trạng thái: ${statusMeta(displayedStatus).label}${e.lastCheckedAt ? ` · Kiểm tra lúc ${new Date(e.lastCheckedAt).toLocaleString('vi-VN')}` : ''}">${statusMeta(displayedStatus).symbol} ${statusMeta(displayedStatus).label}</span>`}
            ${isNewEntry(e) ? `<span class="new-badge" title="Tài khoản mới thêm — tự ẩn sau 24 giờ"><i class="ti ti-sparkles" style="font-size:10px;"></i> MỚI</span>` : ''}
            ${e.platform !== 'phone' ? `<span class="entry-created" title="Ngày nhập tài khoản"><i class="ti ti-calendar-plus" style="font-size:11px;vertical-align:-1px"></i> ${formatDateDMY(new Date(e.createdAt || Date.now()))}</span>` : ''}
          </div>
        </div>
        <div class="entry-actions">
          ${state.selectMode
            ? `<input type="checkbox" class="entry-checkbox" data-select-id="${e.id}" ${state.selectedIds.has(e.id) ? 'checked' : ''}>`
            : `${e.platform === 'facebook' && e.fbName ? `<button class="text-btn" data-act="check" title="Kiểm tra trạng thái tự động" ${isChecking ? 'disabled' : ''}><i class="ti ti-refresh"></i>${isChecking ? t('status_checking') : t('btn_check')}</button>` : ''}
          <button class="text-btn" data-act="edit" title="${t('btn_edit')}"><i class="ti ti-edit"></i>${t('btn_edit')}</button>
          <button class="text-btn danger" data-act="delete" title="${t('btn_delete')}"><i class="ti ti-trash"></i>${t('btn_delete')}</button>`}
        </div>
      </div>
      <div class="entry-details">
        ${isPhoneOrProxy ? '' : display.rows.map(row => `
        <div class="entry-fieldrow">${row.map((f, i) => {
          const sep = i > 0 ? `<span class="field-sep">|</span>` : '';
          if(f.isMailOtpAction){
            return `${sep}<button class="text-btn otp-inline-btn" data-act="read-otp" title="Đọc mã xác nhận Facebook mới nhất từ Outlook" ${isReadingOtp ? 'disabled' : ''}><i class="ti ti-mail-code"></i>${isReadingOtp ? 'Đang đọc...' : t('btn_read_otp')}</button>`;
          }
          if(f.isTotp){
            return `${sep}<span class="field-chip totp" id="totp-${e.id}" title="Mã 2FA hiện tại — bấm để sao chép"><span class="field-label">2FA:</span><span class="field-val" data-totp-val id="totp-val-${e.id}">------</span></span>`;
          }
          const shownVal = f.secret ? '••••••••' : escapeHtml(String(f.value));
          return `${sep}<span class="field-chip ${f.secret?'secret':''}" data-copy-field="${f.field}" title="Bấm để sao chép ${f.label}"><span class="field-label">${f.label}:</span><span class="field-val">${shownVal}</span></span>`;
        }).join('')}</div>`).join('')}
        ${extraFields.length > 0 ? `
        <div class="entry-extra-toggle" data-act="toggle-extra"><i class="ti ti-chevron-right"></i>Xem thêm (${extraFields.length})</div>
        <div class="entry-extra">
          ${extraFields.map(f => `
          <div class="pw-row">
            <i class="ti ${fieldMeta(f.key).icon}" style="color:var(--text-muted);font-size:15px"></i>
            <span class="pw-tag">${f.label}:</span>
            <span class="pw-val" data-pwmask="1" data-field="${f.key}">••••••••</span>
            <button class="text-btn" data-act="toggle-pw" data-field="${f.key}" title="Hiện/ẩn"><i class="ti ti-eye"></i>Hiện</button>
            <button class="text-btn" data-act="copy" data-field="${f.key}" title="Sao chép"><i class="ti ti-copy"></i>Sao chép</button>
          </div>`).join('')}
        </div>` : ''}
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.entry').forEach(card => {
    const id = card.dataset.id;
    const entry = state.entries.find(x => x.id === id);
    card.querySelector('[data-act=toggle-expand]').onclick = (ev) => {
      if(ev.target.closest('[data-act=edit]') || ev.target.closest('[data-act=delete]') || ev.target.closest('[data-act=check]') || ev.target.closest('.entry-checkbox')) return;
      // toggle just this one card's class instead of rebuilding the whole list —
      // expand/collapse is the single most frequent interaction on a long list,
      // so re-rendering everything on each click was the main source of lag.
      if(state.expandedIds.has(id)) state.expandedIds.delete(id);
      else state.expandedIds.add(id);
      card.classList.toggle('expanded');
    };
    const editBtn = card.querySelector('[data-act=edit]');
    if(editBtn) editBtn.onclick = () => openModal(entry);
    const deleteBtn = card.querySelector('[data-act=delete]');
    if(deleteBtn) deleteBtn.onclick = () => confirmDeleteEntry(id, entry.fbName || entry.email || '(chưa đặt tên)');
    const checkBtn = card.querySelector('[data-act=check]');
    if(checkBtn) checkBtn.onclick = () => checkAccountStatus(entry);
    const readOtpBtn = card.querySelector('[data-act=read-otp]');
    if(readOtpBtn) readOtpBtn.onclick = () => readFacebookMailOtp(entry);
    const selectCb = card.querySelector('.entry-checkbox');
    if(selectCb){
      selectCb.onclick = (ev) => ev.stopPropagation();
      selectCb.onchange = () => {
        if(selectCb.checked) state.selectedIds.add(id);
        else state.selectedIds.delete(id);
        updateSelectionBar();
      };
    }

    card.querySelectorAll('[data-act=copy]').forEach(btn => {
      btn.onclick = () => {
        const field = btn.dataset.field;
        const meta = getPlatformFields(entry.platform).find(f => f.key === field);
        copyText(entry[field], `Đã sao chép ${meta ? meta.label.toLowerCase() : 'nội dung'}`, true);
      };
    });

    card.querySelectorAll('[data-act=toggle-pw]').forEach(btn => {
      const field = btn.dataset.field;
      const span = card.querySelector(`[data-pwmask][data-field="${field}"]`);
      let shown = false;
      btn.onclick = () => {
        shown = !shown;
        span.textContent = shown ? (entry[field] || '') : '••••••••';
        btn.querySelector('i').className = shown ? 'ti ti-eye-off' : 'ti ti-eye';
        btn.lastChild.textContent = shown ? 'Ẩn' : 'Hiện';
      };
    });

    if(entry.twoFA){
      const totpSpan = card.querySelector(`#totp-${id}`);
      if(totpSpan){
        totpSpan.onclick = (ev) => {
          ev.stopPropagation();
          copyText(totpCodeCache[id], 'Đã sao chép mã 2FA', true);
        };
      }
    }

    card.querySelectorAll('[data-copy-field]').forEach(span => {
      span.onclick = (ev) => {
        ev.stopPropagation();
        const field = span.dataset.copyField;
        const labels = {
          fbName: 'UID', displayName: 'tên', email: 'email', proxy: 'proxy', expiryDate: 'ngày hết hạn',
          port: 'port', username: 'user', password: 'mật khẩu', emailPassword: 'mật khẩu email',
          secondaryEmail: 'email phụ', secondaryEmailPassword: 'mật khẩu email phụ', phone: 'số điện thoại',
        };
        const sensitiveFields = new Set(['password', 'emailPassword', 'secondaryEmailPassword']);
        const value = field === 'expiryDate' ? toDisplayDate(entry[field]) : entry[field];
        copyText(value, `Đã sao chép ${labels[field] || 'nội dung'}`, sensitiveFields.has(field));
      };
    });

    const extraToggle = card.querySelector('[data-act=toggle-extra]');
    if(extraToggle){
      extraToggle.onclick = (ev) => {
        ev.stopPropagation();
        const extraBox = card.querySelector('.entry-extra');
        const nowOpen = extraToggle.classList.toggle('open');
        if(extraBox) extraBox.classList.toggle('open', nowOpen);
      };
    }
  });

  state.visibleEntries = filtered;
  refreshTotpCodes();
}

function renderPlatformBar(){
  const bar = document.getElementById('platformBar');
  bar.innerHTML = `<div class="ide-sidebar-label code-comment">${t('sidebar_platforms')}</div>` + PLATFORMS.map(p => {
    const isTools = p.id === 'other';
    const c = p.id === 'note' ? state.notes.length : isTools ? null : state.entries.filter(e => e.platform === p.id).length;
    const label = isTools ? t('platform_tools') : escapeHtml(p.name);
    // Real <a href> (not a <button>) so Ctrl/Cmd-click, middle-click, and
    // "open in new tab" all work exactly like a normal browser link — the
    // browser handles that natively, we only intercept a plain left-click.
    return `<a href="#platform=${p.id}" class="platform-chip ${state.activePlatform===p.id?'active':''}" data-platform="${p.id}" style="--pcolor:${p.color};"><span class="platform-icon">${platformSvg(p.id)}</span>${label}${c === null ? '' : `<span class="platform-chip-count">${c}</span>`}</a>`;
  }).join('');
  bar.querySelectorAll('[data-platform]').forEach(link => {
    link.onclick = (ev) => {
      // Ctrl/Cmd/middle-click/shift-click: let the browser open it in a new
      // tab/window on its own — don't intercept, don't switch the tab here.
      if(ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button === 1) return;
      ev.preventDefault();
      state.activePlatform = link.dataset.platform;
      if(location.hash !== `#platform=${link.dataset.platform}`) location.hash = `platform=${link.dataset.platform}`;
      state.activeFolder = 'all';
      state.selectMode = false;
      state.selectedIds = new Set();
      renderVault();
      bar.classList.remove('open'); // close the mobile sidebar drawer after picking a tab
    };
  });
}

function renderStatusFilterBar(){
  const wrap = document.getElementById('statusFilterBar');
  if(!wrap) return;
  const platformEntries = state.entries.filter(e => e.platform === state.activePlatform);
  const counts = { active: 0, inactive: 0, unknown: 0 };
  platformEntries.forEach(e => { counts[e.status || 'unknown'] = (counts[e.status || 'unknown'] || 0) + 1; });

  const statusKeys = ['active', 'inactive', 'unknown'];
  wrap.innerHTML = statusKeys.map(key => {
    const meta = statusMeta(key);
    const hidden = state.hiddenStatuses.has(key);
    return `<button type="button" class="status-filter-chip ${hidden ? 'hidden-state' : ''}" data-status-key="${key}" style="--sc:${meta.color};" title="${hidden ? t('status_filter_hidden') : t('status_filter_shown')}">
      <i class="ti ${hidden ? 'ti-eye-off' : 'ti-eye'}"></i>
      <span>${meta.symbol} ${meta.label}</span>
      <span class="status-filter-count">${counts[key] || 0}</span>
    </button>`;
  }).join('');

  wrap.querySelectorAll('[data-status-key]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.statusKey;
      if(state.hiddenStatuses.has(key)) state.hiddenStatuses.delete(key);
      else state.hiddenStatuses.add(key);
      renderVault();
    };
  });
}

function renderFolderBar(){
  const wrap = document.getElementById('folderBar');
  const platformEntries = state.entries.filter(e => e.platform === state.activePlatform);
  const platformFolders = state.folders.filter(f => f.platformId === state.activePlatform);
  const countAll = platformEntries.length;
  const countNone = platformEntries.filter(e => !e.folderId).length;

  const activeLabel = state.activeFolder === 'all'
    ? t('folder_all')
    : state.activeFolder === NO_FOLDER_ID
    ? t('folder_uncategorized')
    : (folderName(state.activeFolder) || t('folder_all'));
  const activeCount = state.activeFolder === 'all'
    ? countAll
    : state.activeFolder === NO_FOLDER_ID
    ? countNone
    : platformEntries.filter(e => e.folderId === state.activeFolder).length;

  let listHtml = `<button type="button" class="folder-chip ${state.activeFolder==='all'?'active':''}" data-folder="all"><span>${t('folder_all')}</span><span>${countAll}</span></button>`;
  platformFolders.forEach(f => {
    const c = platformEntries.filter(e => e.folderId === f.id).length;
    listHtml += `<button type="button" class="folder-chip ${state.activeFolder===f.id?'active':''}" data-folder="${f.id}"><span>${escapeHtml(f.name)}</span><span>${c}</span></button>`;
  });
  listHtml += `<button type="button" class="folder-chip ${state.activeFolder===NO_FOLDER_ID?'active':''}" data-folder="${NO_FOLDER_ID}"><span>${t('folder_uncategorized')}</span><span>${countNone}</span></button>`;
  listHtml += `<button type="button" class="folder-chip folder-manage-btn" id="manageFoldersBtn" title="${t('folder_manage')}"><span><i class="ti ti-settings" style="font-size:13px;vertical-align:-1px"></i> ${t('folder_manage')}</span></button>`;

  wrap.className = `folder-panel ${state.folderPanelOpen ? 'open' : ''}`;
  wrap.innerHTML = `
    <button type="button" class="folder-toggle" id="folderToggleBtn">
      <span><i class="ti ti-folder" style="font-size:14px;vertical-align:-2px;margin-right:6px;"></i>${escapeHtml(activeLabel)}</span>
      <span class="folder-toggle-right"><span class="folder-toggle-count">${activeCount}</span><i class="ti ti-chevron-down"></i></span>
    </button>
    <div class="folder-list" id="folderList">${listHtml}</div>
  `;

  document.getElementById('folderToggleBtn').onclick = () => {
    state.folderPanelOpen = !state.folderPanelOpen;
    renderFolderBar();
  };

  const bar = document.getElementById('folderList');
  bar.querySelectorAll('[data-folder]').forEach(btn => {
    btn.onclick = () => { state.activeFolder = btn.dataset.folder; renderVault(); };
  });
  document.getElementById('manageFoldersBtn').onclick = openFolderManager;
}

// ---------- NOTES (free-form documents, like Word notes) ----------
function renderNotesVault(){
  const app = document.getElementById('app');
  const q = state.search.toLowerCase();
  const filtered = state.notes
    .filter(n => !q || (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q))
    .sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));

  app.innerHTML = `
    <div class="code-comment" style="font-size:12px; margin-bottom:8px;">${t('comment_notes')}</div>
    <div class="topbar">
      <button class="text-btn" id="lockBtn" title="${t('title_lock')}"><i class="ti ti-lock"></i>${t('btn_lock')}</button>
      <button class="text-btn" id="toolsBtn" title="${t('title_tools')}"><i class="ti ti-tool"></i>${t('btn_tools')}</button>
      <button class="text-btn" id="exportAllNotesBtn" title="Export all notes"><i class="ti ti-download"></i>${t('btn_export')}</button>
      <button class="primary" id="addNoteBtn"><i class="ti ti-plus" style="vertical-align:-2px;font-size:15px"></i> ${t('btn_add_note')}</button>
    </div>
    <div id="list"></div>
  `;

  renderPlatformBar();
  updateIdeChrome();
  document.getElementById('toolsBtn').onclick = openToolsModal;
  syncGlobalSearchBar('notes');
  document.getElementById('lockBtn').onclick = () => { state.key = null; state.entries = []; state.folders = []; state.notes = []; endSession(); renderApp(); };
  document.getElementById('exportAllNotesBtn').onclick = exportAllNotes;
  document.getElementById('addNoteBtn').onclick = () => openNoteModal(null);

  const list = document.getElementById('list');
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><span class="platform-icon" style="width:40px;height:40px;margin:0 auto 8px;--pcolor:${platformMeta('note').color};">${platformSvg('note')}</span>${state.notes.length===0 ? 'Chưa có ghi chú nào. Nhấn "Ghi chú mới" để bắt đầu.' : 'Không tìm thấy kết quả phù hợp.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(n => {
    const preview = (n.content || '').replace(/\s+/g, ' ').trim().slice(0, 140);
    const dt = n.updatedAt ? new Date(n.updatedAt) : null;
    const dtStr = dt ? `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}` : '';
    return `
    <div class="entry" data-id="${n.id}">
      <div class="entry-top" data-act="open-note" style="cursor:pointer;">
        <div class="entry-info">
          <p class="entry-name"><span class="platform-icon" style="width:20px;height:20px;--pcolor:${platformMeta('note').color};">${platformSvg('note')}</span>${escapeHtml(n.title || '(Chưa có tiêu đề)')}</p>
          <p class="entry-id">${escapeHtml(preview)}${(n.content||'').length > 140 ? '…' : ''}</p>
          ${dtStr ? `<span class="entry-folder"><i class="ti ti-clock" style="font-size:11px;vertical-align:-1px"></i> ${dtStr}</span>` : ''}
        </div>
        <div class="entry-actions">
          <button class="text-btn" data-act="export-note" title="Xuất ghi chú này"><i class="ti ti-download"></i>Xuất</button>
          <button class="text-btn" data-act="edit-note" title="${t('btn_edit')}"><i class="ti ti-edit"></i>${t('btn_edit')}</button>
          <button class="text-btn danger" data-act="delete-note" title="${t('btn_delete')}"><i class="ti ti-trash"></i>${t('btn_delete')}</button>
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.entry').forEach(card => {
    const id = card.dataset.id;
    const note = state.notes.find(x => x.id === id);
    card.querySelector('[data-act=open-note]').onclick = (ev) => {
      if(ev.target.closest('[data-act=export-note]') || ev.target.closest('[data-act=edit-note]') || ev.target.closest('[data-act=delete-note]')) return;
      openNoteModal(note);
    };
    card.querySelector('[data-act=edit-note]').onclick = () => openNoteModal(note);
    card.querySelector('[data-act=export-note]').onclick = () => exportSingleNote(note);
    card.querySelector('[data-act=delete-note]').onclick = () => confirmDeleteNote(note);
  });
}

function openNoteModal(note){
  const modalBg = document.getElementById('modalBg');
  modalBg.classList.add('show');
  const modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = `
    <h2>${note ? 'Sửa ghi chú' : 'Ghi chú mới'}</h2>
    <label>Tiêu đề</label>
    <input type="text" id="noteTitle" placeholder="Tiêu đề ghi chú" value="${escapeAttr(note ? note.title : '')}">
    <label>Nội dung</label>
    <textarea id="noteContent" style="min-height:280px; font-family:inherit; line-height:1.6;" placeholder="Nhập nội dung...">${escapeHtml(note ? note.content : '')}</textarea>
    <p class="err" id="noteErr"></p>
    <div class="row">
      <button id="noteCancelBtn" style="flex:1">Huỷ</button>
      <button class="primary" id="noteSaveBtn" data-primary-action style="flex:1">Lưu</button>
    </div>
  `;
  document.getElementById('noteCancelBtn').onclick = closeModal;
  document.getElementById('noteSaveBtn').onclick = async () => {
    const title = document.getElementById('noteTitle').value.trim();
    const content = document.getElementById('noteContent').value;
    const err = document.getElementById('noteErr');
    err.style.display = 'none';
    if(!title && !content.trim()){
      err.textContent = 'Nhập ít nhất tiêu đề hoặc nội dung.';
      err.style.display = 'block';
      return;
    }
    const nextNotes = note
      ? state.notes.map(n => n.id === note.id ? { ...n, title, content, updatedAt: Date.now() } : n)
      : [...state.notes, { id: uid(), title, content, updatedAt: Date.now() }];
    if(!await commitCollection('notes', nextNotes, saveNotes)) return;
    closeModal();
    renderVault();
    toast('Đã lưu ghi chú');
  };
}

function confirmDeleteNote(note){
  showConfirm(
    'Xoá ghi chú?',
    `Bạn có chắc chắn muốn xoá ghi chú "${note.title || '(chưa có tiêu đề)'}"? Hành động này không thể hoàn tác.`,
    async () => {
      const nextNotes = state.notes.filter(n => n.id !== note.id);
      if(!await commitCollection('notes', nextNotes, saveNotes)) return;
      renderVault();
      toast('Đã xoá ghi chú');
    }
  );
}

function exportSingleNote(note){
  showConfirm(
    'Xuất ghi chú này?',
    `Tải ghi chú "${note.title || '(chưa có tiêu đề)'}" ra file văn bản.`,
    () => {
      const content = `${note.title || '(Chưa có tiêu đề)'}\n${'='.repeat(30)}\n\n${note.content || ''}`;
      const safeName = (note.title || 'ghi-chu').replace(/[^a-zA-Z0-9]/g, '_').slice(0, 40) || 'ghi-chu';
      downloadTextFile(content, `devic3-note-${safeName}.txt`);
      toast('Đã xuất ghi chú');
    },
    'Xuất file',
    false
  );
}

function exportAllNotes(){
  if(state.notes.length === 0){
    toast('Chưa có ghi chú nào để xuất');
    return;
  }
  showConfirm(
    'Xuất toàn bộ ghi chú?',
    `File xuất ra sẽ chứa toàn bộ ${state.notes.length} ghi chú.`,
    () => {
      const lines = [`# Devic3 - Ghi chú`, `# Xuất lúc: ${new Date().toLocaleString('vi-VN')}`, ''];
      state.notes.slice().sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0)).forEach(n => {
        lines.push(`## ${n.title || '(Chưa có tiêu đề)'}`);
        lines.push(n.content || '');
        lines.push('');
        lines.push('---');
        lines.push('');
      });
      const date = new Date();
      const ds = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}-${String(date.getHours()).padStart(2,'0')}${String(date.getMinutes()).padStart(2,'0')}`;
      downloadTextFile(lines.join('\n'), `devic3-notes-${ds}.txt`);
      toast('Đã xuất toàn bộ ghi chú');
    },
    'Xuất file',
    false
  );
}


// SECURITY: auto-clears the clipboard a short while after copying sensitive
// data (passwords, cookies, tokens, 2FA codes) — a copied secret doesn't
// linger on the clipboard indefinitely where another app or a shared/public
// computer's next user could accidentally paste it somewhere. Only clears if
// the clipboard still holds exactly what we copied (so it never wipes
// something else the person copied afterwards).
const CLIPBOARD_AUTOCLEAR_MS = 20000;
function scheduleClipboardAutoClear(text){
  if(!(navigator.clipboard && navigator.clipboard.readText && navigator.clipboard.writeText && window.isSecureContext)) return;
  setTimeout(async () => {
    try{
      const current = await navigator.clipboard.readText();
      if(current === text){
        await navigator.clipboard.writeText('');
      }
    }catch(e){
      // clipboard read can be denied/unavailable (e.g. tab lost focus) — nothing to do
    }
  }, CLIPBOARD_AUTOCLEAR_MS);
}

function copyText(text, msg, sensitive){
  if(!text){ toast('Không có nội dung để sao chép'); return; }

  const fallbackCopy = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok){
        toast(sensitive ? `${msg} (tự xoá khỏi clipboard sau 20s)` : msg);
        if(sensitive) scheduleClipboardAutoClear(text);
      } else {
        toast('Không thể sao chép tự động — hãy bôi đen và copy thủ công (Ctrl+C)');
      }
    }catch(err){
      toast('Không thể sao chép tự động — hãy bôi đen và copy thủ công (Ctrl+C)');
    }
  };

  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => {
      toast(sensitive ? `${msg} (tự xoá khỏi clipboard sau 20s)` : msg);
      if(sensitive) scheduleClipboardAutoClear(text);
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

// ---------- EXPORT ----------
function downloadTextFile(content, filename){
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildEntryLine(e){
  const base = getPlatformFields(e.platform).map(f => {
    if(fieldMeta(f.key).kind === 'date') return toDisplayDate(e[f.key]) || '';
    return e[f.key] || '';
  }).join(platformDelimiter(e.platform));
  const folder = folderName(e.folderId) || '';
  return `${base}|${folder}|${e.displayName || ''}|${e.proxy || ''}`;
}

function buildExportContent(){
  const lines = [
    `# Devic3 - Sao lưu tài khoản`,
    `# Xuất lúc: ${new Date().toLocaleString('vi-VN')}`,
    `# Mỗi nền tảng có định dạng cột riêng, xem dòng "Định dạng:" ngay trên từng nhóm bên dưới.`,
    ``
  ];
  PLATFORMS.forEach(p => {
    const list = state.entries.filter(e => e.platform === p.id);
    if(list.length === 0) return;
    const fmt = backupPlatformFormatHint(p.id) + '|Thư mục|Tên|Proxy';
    lines.push(`## ${p.name} (${list.length}) — Định dạng: ${fmt}`);
    list.forEach(e => lines.push(buildEntryLine(e)));
    lines.push('');
  });
  return lines.join('\n');
}

// --- secure random password generator (crypto.getRandomValues, not Math.random) ---
function secureRandomInt(max){
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % max;
}

const PW_POOLS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  digits: '0123456789',
  symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?',
};

function generateSecurePassword(length, sets){
  const pools = Object.keys(PW_POOLS).filter(k => sets[k]).map(k => PW_POOLS[k]);
  if(pools.length === 0) pools.push(PW_POOLS.lower);
  const combined = pools.join('');
  const chars = [];
  // guarantee at least one char from every selected set
  pools.forEach(pool => chars.push(pool[secureRandomInt(pool.length)]));
  while(chars.length < length){
    chars.push(combined[secureRandomInt(combined.length)]);
  }
  // Fisher-Yates shuffle using the same secure randomness source
  for(let i = chars.length - 1; i > 0; i--){
    const j = secureRandomInt(i + 1);
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  return chars.slice(0, length).join('');
}

function estimatePasswordStrength(length, sets){
  let poolSize = 0;
  if(sets.upper) poolSize += 26;
  if(sets.lower) poolSize += 26;
  if(sets.digits) poolSize += 10;
  if(sets.symbols) poolSize += PW_POOLS.symbols.length;
  if(poolSize === 0) poolSize = 26;
  const bits = Math.round(Math.log2(poolSize) * length);
  if(bits >= 100) return { label: 'Rất mạnh', color: '#4ade80', bits };
  if(bits >= 70) return { label: 'Mạnh', color: '#4ade80', bits };
  if(bits >= 50) return { label: 'Khá', color: '#facc15', bits };
  return { label: 'Yếu — nên tăng độ dài hoặc thêm loại ký tự', color: '#f87171', bits };
}

// --- Facebook ID extractor: 100% client-side URL parsing, no network requests ---
function extractFacebookId(input){
  const raw = (input || '').trim();
  if(!raw) return null;
  if(/^\d{5,20}$/.test(raw)) return raw; // already a raw numeric UID
  let m = raw.match(/[?&]id=(\d{5,20})/);
  if(m) return m[1]; // profile.php?id=...
  m = raw.match(/facebook\.com\/(\d{5,20})(?:[/?]|$)/i);
  if(m) return m[1]; // facebook.com/100012345678
  return null; // vanity username link — can't be resolved without contacting Facebook's servers
}

// --- 2FA decoder: paste a base32 TOTP secret, get the live 6-digit code ---
// (reuses the same computeTotp/base32Decode already used for saved accounts)
function renderTotpDecoderTool(){
  if(totpToolInterval){ clearInterval(totpToolInterval); totpToolInterval = null; }
  const modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = `
    <h2>${t('tool_2fa_title')}</h2>
    <p class="hint" style="margin-top:-4px;">Dán mã bí mật 2FA (Base32, dạng chữ hoa A-Z và số 2-7) để xem ngay mã 6 số hiện tại — xử lý hoàn toàn trong trình duyệt, không gửi đi đâu cả.</p>
    <label>Mã bí mật 2FA</label>
    <input type="text" id="totpSecretInput" placeholder="VD: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ" style="font-family:var(--mono);" autocomplete="off">
    <p class="err" id="totpErr"></p>
    <div class="pw-row" id="totpResultRow" style="display:none; margin-bottom:10px;">
      <span class="pw-val" id="totpResultCode" data-totp-val style="font-family:var(--mono); font-size:26px; letter-spacing:4px; font-weight:700; color:#facc15; transition:color .3s ease;"></span>
      <button class="text-btn" id="totpCopyBtn" title="Sao chép"><i class="ti ti-copy"></i>Sao chép</button>
    </div>
    <div id="totpCountdownWrap" style="display:none; margin-bottom:16px;">
      <div style="height:4px; background:#1f1f1f; border-radius:999px; overflow:hidden;">
        <div id="totpCountdownBar" style="height:100%; background:var(--accent); width:100%;"></div>
      </div>
    </div>
    <button id="totp2faBackBtn" style="width:100%;">Quay lại</button>
  `;
  document.getElementById('totp2faBackBtn').onclick = () => {
    if(totpToolInterval){ clearInterval(totpToolInterval); totpToolInterval = null; }
    renderToolsChooser();
  };

  const input = document.getElementById('totpSecretInput');
  const err = document.getElementById('totpErr');
  const resultRow = document.getElementById('totpResultRow');
  const codeSpan = document.getElementById('totpResultCode');
  const countdownWrap = document.getElementById('totpCountdownWrap');
  const countdownBar = document.getElementById('totpCountdownBar');
  let lastCode = '';

  const refresh = async () => {
    const secret = input.value.trim();
    if(!secret){
      err.style.display = 'none';
      resultRow.style.display = 'none';
      countdownWrap.style.display = 'none';
      return;
    }
    const code = await computeTotp(secret);
    if(!code){
      err.textContent = 'Mã bí mật không hợp lệ — chỉ chấp nhận ký tự Base32 (chữ A-Z và số 2-7).';
      err.style.display = 'block';
      resultRow.style.display = 'none';
      countdownWrap.style.display = 'none';
      return;
    }
    err.style.display = 'none';
    lastCode = code;
    codeSpan.textContent = code;
    resultRow.style.display = 'flex';
    countdownWrap.style.display = 'block';
    const secsLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
    const totpColor = totpColorForSecondsLeft(secsLeft);
    if(countdownBar){ countdownBar.style.width = (secsLeft / 30 * 100) + '%'; countdownBar.style.background = totpColor; }
    codeSpan.style.color = totpColor;
  };

  document.getElementById('totpCopyBtn').onclick = () => { if(lastCode) copyText(lastCode, 'Đã sao chép mã 2FA', true); };
  input.oninput = refresh;
  refresh();
  totpToolInterval = setInterval(refresh, 1000);
}

  const nextEntries = state.entries.map(e => e.id === entryId

  );

async function readFacebookMailOtp(entry){
  const mailboxEmail = entry.platform === 'hotmail' ? entry.fbName : entry.email;
  const missing = [];
  if(!mailboxEmail) missing.push('Email');
  if(!entry.mailRefreshToken) missing.push('Refresh Token Mail');
  if(!entry.mailClientId) missing.push('Client ID Mail');
  if(missing.length){
    openMailOtpConfigHelp(entry, missing);
    return;
  }
  if(state.otpReadingIds.has(entry.id)) return;

  state.otpReadingIds.add(entry.id);
  renderVault();
  try{
    const response = await fetch('/devic3-mail-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      credentials: 'same-origin',
      cache: 'no-store',
      body: JSON.stringify({
        email: mailboxEmail,
        refreshToken: entry.mailRefreshToken,
        clientId: entry.mailClientId,
      }),
    });
    const responseText = await response.text();
    let result;
    try{
      result = responseText ? JSON.parse(responseText) : null;
    }catch(e){
      const looksLikeHtml = /^\s*(?:<!doctype|<html|<head|<body)/i.test(responseText);
      if(looksLikeHtml){
        throw new Error('Nút Đọc OTP đang kết nối nhầm server tĩnh. Hãy đóng server cũ, chạy “npm start”, rồi tải lại ứng dụng.');
      }
      throw new Error(`Dịch vụ đọc OTP trả về dữ liệu không hợp lệ (HTTP ${response.status}). Hãy khởi động lại bằng “npm start”.`);
    }
    if(!result || typeof result !== 'object'){
      throw new Error(`Dịch vụ đọc OTP không trả về dữ liệu (HTTP ${response.status}). Hãy khởi động lại bằng “npm start”.`);
    }

    if(result.rotatedRefreshToken){
      const saved = await saveRotatedMailRefreshToken(entry.id, result.rotatedRefreshToken);
      if(!saved) throw new Error('Đã đọc thư nhưng không lưu được refresh token mới. Hãy thử lại trước khi đóng ứng dụng.');
    }
    if(!response.ok) throw new Error(result.message || 'Không tìm thấy mã OTP phù hợp.');
    showMailOtpResult(result);
  }catch(error){
    const message = location.protocol === 'file:'
      ? 'Tính năng này cần chạy bằng server cục bộ. Hãy dùng lệnh “npm start” rồi mở địa chỉ được hiển thị.'
      : (error.message || 'Không kết nối được dịch vụ đọc OTP cục bộ.');
    showMailOtpError(message);
  }finally{
    state.otpReadingIds.delete(entry.id);
    renderVault();
  }
}

// ---------- AUTOMATIC FACEBOOK UID STATUS CHECK ----------
// Requests are globally queued so rapid clicks (or a future bulk-check action)
// never create an unbounded burst against Graph API.
const FB_CHECK_TIMEOUT_MS = 10000;
const FB_CHECK_CONCURRENCY = 4;
let fbChecksInFlight = 0;
const fbCheckQueue = [];

function runFacebookCheckQueued(task){
  return new Promise((resolve) => {
    fbCheckQueue.push({ task, resolve });
    drainFacebookCheckQueue();
  });
}

function drainFacebookCheckQueue(){
  while(fbChecksInFlight < FB_CHECK_CONCURRENCY && fbCheckQueue.length){
    const { task, resolve } = fbCheckQueue.shift();
    fbChecksInFlight++;
    Promise.resolve()
      .then(task)
      .then(resolve, () => resolve('unknown'))
      .finally(() => {
        fbChecksInFlight--;
        drainFacebookCheckQueue();
      });
  }
}

function checkFacebookUid(uid){
  return runFacebookCheckQueued(async () => {
    const normalizedUid = String(uid || '').trim();
    if(!/^\d{5,20}$/.test(normalizedUid)) return 'unknown';
    if(typeof navigator !== 'undefined' && !navigator.onLine) return 'unknown';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), FB_CHECK_TIMEOUT_MS);
    const url = `https://graph.facebook.com/${encodeURIComponent(normalizedUid)}/picture?type=normal`;
    try{
      const response = await fetch(url, {
        method: 'GET',
        redirect: 'follow',
        cache: 'no-store',
        credentials: 'omit',
        signal: controller.signal,
      });
      return /100x100/i.test(response.url || '') ? 'active' : 'inactive';
    }catch(error){
      return 'unknown';
    }finally{
      clearTimeout(timeoutId);
    }
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;

}
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

// ---------- AUTO-PARSE ----------
// format: UID|PASS|2FA|Email|Passemail|Email phụ|Cookie|Token|Khác|
// ---------- SMART FIELD DETECTION (auto-import) ----------
// Content-pattern checks used to catch and auto-correct common column-order mistakes
// when pasting bulk data — e.g. an email accidentally landing in the "2FA" slot.
function looksLikeUid(s){
  return /^\d{5,20}$/.test((s || '').trim());
}
// A real email address can never legally exceed 254 characters total, 64 in the
// local-part before "@" (RFC 5321/5322) — and it never contains ";" or spaces.
// Facebook cookie strings, by contrast, are long semicolon-separated key=value
// pairs (c_user=...;xs=...;datr=...) that can easily run past 300+ characters.
// Checking both shape AND length lets us tell a real email apart from a cookie
// blob that got pasted into the wrong column.
const EMAIL_MAX_TOTAL = 254;
const EMAIL_MAX_LOCAL = 64;
function looksLikeEmail(s){
  const v = (s || '').trim();
  if(!v || v.length > EMAIL_MAX_TOTAL) return false;
  if(v.includes(';') || v.includes(' ')) return false;
  const at = v.indexOf('@');
  if(at <= 0 || at !== v.lastIndexOf('@')) return false;
  if(v.slice(0, at).length > EMAIL_MAX_LOCAL) return false;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}
function looksLike2FASecret(s){
  const t = (s || '').replace(/\s+/g, '');
  return t.length >= 16 && /^[A-Za-z2-7]+$/.test(t) && !t.includes('@');
}
// Cookie/token dumps are long and, for cookies specifically, made of several
// "key=value;" pairs — a shape a real email address never has.
// A browser cookie header has a very rigid, checkable shape: two or more
// "key=value" pairs joined by semicolons (that's literally the HTTP Cookie
// header format — e.g. "c_user=123;xs=abc;datr=xyz;"). Checking for THIS
// specific structure — rather than just "is it long" — is what actually
// separates a cookie from a token: plenty of real tokens (JWTs, Microsoft
// MSA artifacts, OAuth opaque tokens) are just as long as a cookie dump but
// don't have the "k=v;k=v" shape, so treating "long" alone as "must be a
// cookie" is exactly what was causing Cookie and Token to get mixed up.
function looksLikeCookieHeader(s){
  const v = (s || '').trim();
  if(v.length <= 20) return false;
  const kvPairs = v.split(';').map(p => p.trim()).filter(p => p.includes('=') && !p.includes(' ')).length;
  return kvPairs >= 2;
}
// Anything else long and opaque that ISN'T a cookie header and ISN'T a
// Facebook "EAA..." access token still behaves like a token/session blob —
// this is the fallback for token formats without a fixed prefix (JWTs, MSA
// artifacts, generic OAuth tokens). The 100-char floor keeps this from
// mistaking an unusually long but genuine PASSWORD for a token.
function looksLikeOpaqueTokenBlob(s){
  const v = (s || '').trim();
  if(v.length <= 100) return false;
  if(looksLikeCookieHeader(v)) return false; // cookie shape takes priority
  return true;
}

// Facebook's format has fields with very distinctive, checkable shapes
// (UID = digits only, 2FA = long base32 secret, Email = short and RFC-valid,
// Cookie = long "key=value;" dump, Token = Facebook access token "EAA..."
// prefix). Real-world pasted data doesn't always follow our exact column
// order — some sources list Cookie/Token before Email, for example — so
// instead of only checking one pair at a time, this classifies EVERY
// flexible field by its actual content shape and reassigns all of them
// together. Anything left over that doesn't fit a known slot is appended to
// "Khác" rather than silently dropped, so no data is ever lost.
function looksLikeFacebookToken(s){
  return /^EAA[A-Za-z0-9]{15,}$/.test((s || '').trim());
}
function classifyFacebookValue(v){
  if(!v) return 'empty';
  if(looksLikeFacebookToken(v)) return 'token';
  if(looksLikeCookieHeader(v)) return 'cookie';
  if(looksLike2FASecret(v)) return 'twofa';
  if(looksLikeEmail(v)) return 'email';
  if(looksLikeOpaqueTokenBlob(v)) return 'token';
  return 'unknown';
}
function smartCorrectFacebookFields(fields){
  const f = { ...fields };

  // UID vs Email — kept separate since fbName has its own dedicated,
  // very reliable digits-only check (not part of the pool below).
  if(f.fbName && f.email && !looksLikeUid(f.fbName) && looksLikeEmail(f.fbName) && looksLikeUid(f.email) && !looksLikeEmail(f.email)){
    [f.fbName, f.email] = [f.email, f.fbName];
  }

  const slotOrder = ['twoFA', 'email', 'emailPassword', 'secondaryEmail', 'cookie', 'token'];
  const typeOf = {};
  slotOrder.forEach(k => { typeOf[k] = classifyFacebookValue(f[k]); });

  // Only step in when something is CLEARLY misplaced — stays a no-op on data
  // that's already fine, exactly like before.
  const emailSlotWrong = f.email && typeOf.email !== 'email';
  const cookieSlotWrong = f.cookie && typeOf.cookie !== 'cookie' && typeOf.cookie !== 'unknown';
  const tokenSlotWrong = f.token && typeOf.token !== 'token' && typeOf.token !== 'unknown';
  const cookieHidingElsewhere = ['twoFA', 'emailPassword', 'secondaryEmail', 'token'].some(k => typeOf[k] === 'cookie');
  const tokenHidingElsewhere = ['twoFA', 'email', 'emailPassword', 'secondaryEmail', 'cookie'].some(k => typeOf[k] === 'token');
  const twofaHidingElsewhere = ['email', 'emailPassword', 'secondaryEmail', 'cookie', 'token'].some(k => typeOf[k] === 'twofa');

  const needsReassignment = emailSlotWrong || cookieSlotWrong || tokenSlotWrong || cookieHidingElsewhere || tokenHidingElsewhere || twofaHidingElsewhere;

  if(needsReassignment){
    const pool = { twofa: [], cookie: [], token: [], email: [], unknown: [] };
    slotOrder.forEach(k => {
      const v = f[k];
      if(!v) return;
      const type = typeOf[k];
      pool[type === 'empty' ? 'unknown' : type].push(v);
    });
    const take = (arr) => arr.length ? arr.shift() : '';

    f.twoFA = take(pool.twofa);
    f.cookie = take(pool.cookie);
    f.token = take(pool.token);
    f.email = take(pool.email);
    f.secondaryEmail = take(pool.email); // a second email, if there were two
    f.emailPassword = take(pool.unknown);

    // safety net: anything left over across every category goes into "Khác"
    // instead of vanishing, even if we couldn't place it perfectly
    const leftovers = [...pool.twofa, ...pool.cookie, ...pool.token, ...pool.email, ...pool.unknown];
    if(leftovers.length){
      f.other = [f.other, ...leftovers].filter(Boolean).join(' | ');
    }
  }

  return f;
}

function parseAutoLine(line, platformId){
  const parts = line.split(platformDelimiter(platformId)).map(p => p.trim());
  const obj = {};
  getPlatformInputFields(platformId).forEach((f, i) => { obj[f.key] = parts[i] || ''; });
  if(platformId === 'facebook'){
    return smartCorrectFacebookFields(obj);
  }
  return obj;
}

      showConfirm(
        'Xoá thư mục?',
        `Bạn có chắc chắn muốn xoá thư mục "${f ? f.name : ''}"? Các tài khoản trong thư mục này sẽ chuyển về "Chưa phân loại", không bị xoá.`,
        async () => {
          const nextFolders = state.folders.filter(x => x.id !== id);
          const nextEntries = state.entries.map(e => e.folderId === id ? { ...e, folderId: '' } : e);
          if(!await commitCollections([
            { property: 'folders', nextValue: nextFolders, saveFn: saveFolders },
            { property: 'entries', nextValue: nextEntries, saveFn: saveEntries },
          ])) return;
          if(state.activeFolder === id) state.activeFolder = 'all';
          openFolderManager();
          toast('Đã xoá thư mục');
        }
      );
    };
  });
}

async function addFolder(){

  const name = input.value.trim();

  err.style.display = 'none';

  renderFolderRows();
}

function openModal(entry){
  state.editingId = entry ? entry.id : null;
  // editing always forced to manual; adding a new account keeps whatever tab
  // the caller pre-selected (e.g. the Phone quick-import jumps straight to
  // "Tự động"), defaulting to manual if nothing was set
  if(entry || !state.modalTab) state.modalTab = 'manual';

function folderOptionsHtml(selectedId, platformId){
  let html = `<option value="">Chưa phân loại</option>`;
  state.folders.filter(f => f.platformId === platformId).forEach(f => {
    html += `<option value="${f.id}" ${selectedId===f.id?'selected':''}>${escapeHtml(f.name)}</option>`;
  });
  return html;
}

function platformOptionsHtml(selectedId){
  return PLATFORMS.map(p => `<option value="${p.id}" ${selectedId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
}

// renders just the platform-specific input/textarea fields (the part that changes when
// the platform dropdown changes), given already-typed values to preserve where possible
function dynamicFieldsHtml(platformId, valuesObj){
  return getPlatformInputFields(platformId).map(f => {
    const meta = fieldMeta(f.key);
    const val = (valuesObj && valuesObj[f.key]) || '';
    if(meta.kind === 'area'){
      return `<label>${f.label}</label><textarea id="f_${f.key}" placeholder="Không bắt buộc">${escapeHtml(val)}</textarea>`;
    }
    if(meta.kind === 'date'){
      return `<label>${f.label}</label><input type="text" id="f_${f.key}" placeholder="dd/mm/yyyy" value="${escapeAttr(toDisplayDate(val))}">`;
    }
    if(meta.kind === 'secret'){
      return `<label>${f.label}</label><input type="password" id="f_${f.key}" placeholder="Không bắt buộc" value="${escapeAttr(val)}" autocomplete="off" spellcheck="false">`;
    }
    return `<label>${f.label}</label><input type="text" id="f_${f.key}" placeholder="Không bắt buộc" value="${escapeAttr(val)}">`;
  }).join('');
}

function manualFieldsHtml(entry){
  const currentPlatform = entry ? entry.platform : state.activePlatform;
  const platformSelect = `<label>Nền tảng</label><select id="f_platform">${platformOptionsHtml(currentPlatform)}</select>`;
  const folderSelect = `<label>Thư mục</label><select id="f_folderId">${folderOptionsHtml(entry ? entry.folderId : '', currentPlatform)}</select>`;
  // "Tên" (display name/nickname) can only be set while editing an existing account
  const nameField = entry ? `<label>Tên</label><input type="text" id="f_displayName" placeholder="Không bắt buộc" value="${escapeAttr(entry.displayName)}">` : '';
  // "Proxy" also only settable while editing — lets you type freely OR quickly
  // pick from the list of IPs already saved in the Proxy tab
  const savedProxies = state.entries.filter(e => e.platform === 'proxy' && e.fbName);
  const proxyDatalistOptions = savedProxies.map(e =>
    `<option value="${escapeAttr(e.fbName)}">${escapeAttr(e.fbName)}${e.username ? ' — ' + escapeAttr(e.username) : ''}</option>`
  ).join('');
  const proxyField = entry ? `<label>Proxy</label><input type="text" id="f_proxy" list="proxyDatalist" placeholder="${savedProxies.length ? 'Gõ hoặc chọn từ danh sách Proxy đã lưu' : 'Không bắt buộc'}" value="${escapeAttr(entry.proxy)}"><datalist id="proxyDatalist">${proxyDatalistOptions}</datalist>` : '';
  // "Trạng thái" also only settable while editing
  const currentStatus = entry ? (entry.status || 'unknown') : 'unknown';
  const statusField = entry ? `<label>Trạng thái tài khoản</label><select id="f_status">
      <option value="unknown" ${currentStatus==='unknown'?'selected':''}>? Chưa xác định</option>

  const dynamicWrap = `<div id="dynamicFieldsWrap">${dynamicFieldsHtml(currentPlatform, entry || {})}</div>`;
  return platformSelect + folderSelect + nameField + proxyField + statusField + dynamicWrap;
}

// finds an existing entry on the same platform with the same primary identifier (fbName),
// excluding the entry currently being edited (if any)
function findDuplicateEntry(platform, fbNameValue, excludeId){
  if(!fbNameValue) return null;
  return state.entries.find(e => e.platform === platform && e.fbName === fbNameValue && e.id !== excludeId) || null;
}

function stageBulkImport(platform, parsedLines, folderId, currentEntries){
  const nextEntries = currentEntries.map(e => ({ ...e }));
  const newOnes = [];
  const dupPairs = [];
  const seen = new Map();
  nextEntries.forEach(e => { if(e.platform === platform && e.fbName) seen.set(e.fbName, e); });
  parsedLines.forEach(fields => {
    const existing = fields.fbName ? seen.get(fields.fbName) : null;
    if(existing){
      dupPairs.push({ fields, existing });
      return;
    }
    const record = {
      id: uid(), createdAt: Date.now(), ...fields,
      folderId, platform, updatedAt: Date.now(),
    };
    newOnes.push(record);
    nextEntries.push(record);
    if(fields.fbName) seen.set(fields.fbName, record);
  });
  return { nextEntries, newOnes, dupPairs };
}

// Scans every entry in the current platform and groups any that share the same
// primary identifier (UID/Email/User...) — lets someone find and clean up
// duplicates left over from past bulk-imports, instead of stumbling into them
// one at a time while editing.
function findAllDuplicateGroups(platformId){
  const byName = {};
  state.entries.filter(e => e.platform === platformId && e.fbName).forEach(e => {
    if(!byName[e.fbName]) byName[e.fbName] = [];
    byName[e.fbName].push(e);
  });
  return Object.entries(byName).filter(([, list]) => list.length > 1).map(([name, list]) => ({ name, list }));
}

  modalBody.innerHTML = `

      ? `<p style="font-size:14px; color:var(--text-2);">Không tìm thấy tài khoản nào bị trùng định danh trong ${escapeHtml(meta.name)}.</p>`
      : `<p class="hint" style="margin-top:-4px;">Tìm thấy ${groups.length} định danh bị trùng (tổng ${groups.reduce((s,g)=>s+g.list.length,0)} bản ghi). Chọn bản ghi muốn giữ lại — các bản còn lại trong cùng nhóm sẽ bị xoá.</p>
      <div style="display:flex; flex-direction:column; gap:12px; max-height:360px; overflow-y:auto;">
        ${groups.map((g, gi) => `
          <div style="border:0.5px solid var(--border); border-radius:10px; padding:10px 12px;">
            <div style="font-size:13px; color:var(--text-2); margin-bottom:8px;">Trùng "<b style="color:var(--text);">${escapeHtml(g.name)}</b>" (${g.list.length} bản ghi)</div>
            ${g.list.map((e, ei) => `
              <label style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; cursor:pointer;">
                <input type="radio" name="dupgroup-${gi}" value="${e.id}" ${ei===0?'checked':''}>
                <span>${escapeHtml(e.displayName || '(chưa có tên)')} — ${e.updatedAt ? new Date(e.updatedAt).toLocaleString('vi-VN') : 'không rõ thời gian sửa'}</span>
              </label>
            `).join('')}
          </div>
        `).join('')}
      </div>
      <button id="dupScanCleanBtn" class="danger" style="width:100%; margin-top:14px;">Xoá các bản trùng, chỉ giữ bản đã chọn</button>
      `}
    <button id="dupScanCloseBtn" style="width:100%; margin-top:10px;">Đóng</button>
  `;
  document.getElementById('dupScanCloseBtn').onclick = closeModal;
  const cleanBtn = document.getElementById('dupScanCleanBtn');
  if(cleanBtn){
    cleanBtn.onclick = () => {
      const keepIds = new Set();
      groups.forEach((g, gi) => {
        const checked = modalBody.querySelector(`input[name="dupgroup-${gi}"]:checked`);
        keepIds.add(checked ? checked.value : g.list[0].id);

      const idsToDelete = new Set();
      groups.forEach(g => g.list.forEach(e => { if(!keepIds.has(e.id)) idsToDelete.add(e.id); }));
      showConfirm(
        'Xoá các bản trùng?',
        `Sẽ xoá ${idsToDelete.size} bản ghi trùng lặp, chỉ giữ lại 1 bản cho mỗi định danh đã chọn. Hành động này không thể hoàn tác.`,
        async () => {

          if(!await commitCollection('entries', nextEntries, saveEntries)) return;
          closeModal();
          renderVault();
          toast(`Đã xoá ${idsToDelete.size} tài khoản trùng lặp`);

  }

async function saveModal(entry){
  const err = document.getElementById('modalErr');
  err.style.display = 'none';

  if(state.modalTab === 'manual'){
    const platform = document.getElementById('f_platform').value;
    const fields = {};
    getPlatformFields(platform).forEach(f => {
      const el = document.getElementById('f_' + f.key);
      if(el) fields[f.key] = el.value.trim();
    });
    fields.folderId = document.getElementById('f_folderId').value;
    fields.platform = platform;
    const displayNameInput = document.getElementById('f_displayName');
    if(displayNameInput) fields.displayName = displayNameInput.value.trim();
    const proxyInput = document.getElementById('f_proxy');
    if(proxyInput) fields.proxy = proxyInput.value.trim();
    const statusInput = document.getElementById('f_status');
    if(statusInput) fields.status = statusInput.value;
    if(!fields.fbName && !fields.email){
      err.textContent = 'Nhập ít nhất UID hoặc Email.';
      err.style.display = 'block';
      return;
    }
    fields.updatedAt = Date.now();

    const commitManual = async () => {
      const nextEntries = state.editingId
        ? state.entries.map(e => e.id === state.editingId ? { ...e, ...fields } : e)
        : [...state.entries, { id: uid(), createdAt: Date.now(), ...fields }];
      if(!await commitCollection('entries', nextEntries, saveEntries)) return;
      closeModal();
      renderVault();
      toast('Đã lưu');
    };

    const dup = findDuplicateEntry(platform, fields.fbName, state.editingId);
    if(dup){
      showDuplicateChoice(
        dup.fbName,
        async () => {
          // While editing A into B's identifier, replace B and remove A;
          // otherwise both records would remain duplicated.
          const nextEntries = state.entries
            .filter(e => !state.editingId || e.id !== state.editingId || e.id === dup.id)
            .map(e => e.id === dup.id ? { ...e, ...fields } : e);
          if(!await commitCollection('entries', nextEntries, saveEntries)) return;
          closeModal(); renderVault(); toast('Đã ghi đè tài khoản');
        },
        () => { closeModal(); toast('Đã bỏ qua, không nhập tài khoản trùng'); }
      );
      return;
    }
    await commitManual();
  } else {
    const folderId = document.getElementById('f_auto_folderId').value;
    const platform = document.getElementById('f_auto_platform').value;
    const raw = document.getElementById('fAuto').value;
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if(lines.length === 0){
      err.textContent = `Dán nội dung theo định dạng ${platformFormatHint(platform)}`;
      err.style.display = 'block';
      return;
    }
    if(state.editingId){
      const fields = parseAutoLine(lines[0], platform);
      if(!fields.fbName && !fields.email){
        err.textContent = 'Không đọc được trường định danh chính từ dữ liệu dán vào.';
        err.style.display = 'block';
        return;
      }
      fields.folderId = folderId;
      fields.platform = platform;
      fields.updatedAt = Date.now();

      const dup = findDuplicateEntry(platform, fields.fbName, state.editingId);
      if(dup){
        showDuplicateChoice(
          dup.fbName,
          async () => {
            const nextEntries = state.entries
              .filter(e => e.id !== state.editingId || e.id === dup.id)
              .map(e => e.id === dup.id ? { ...e, ...fields } : e);
            if(!await commitCollection('entries', nextEntries, saveEntries)) return;
            closeModal(); renderVault(); toast('Đã ghi đè tài khoản');
          },
          () => { closeModal(); toast('Đã bỏ qua, không nhập tài khoản trùng'); }
        );
        return;
      }
      const nextEntries = state.entries.map(e => e.id === state.editingId ? { ...e, ...fields } : e);
      if(!await commitCollection('entries', nextEntries, saveEntries)) return;
      closeModal();
      renderVault();
      toast('Đã lưu');
    } else {
      const parsedLines = lines.map(line => parseAutoLine(line, platform)).filter(f => f.fbName || f.email);
      const skippedCount = lines.length - parsedLines.length;
      if(parsedLines.length === 0){
        err.textContent = 'Không đọc được dữ liệu hợp lệ. Kiểm tra lại định dạng.';
        err.style.display = 'block';
        return;
      }

      const { nextEntries, newOnes, dupPairs } = stageBulkImport(platform, parsedLines, folderId, state.entries);

      const finishBulk = async (overwrittenCount) => {
        if(!await commitCollection('entries', nextEntries, saveEntries)) return;
        closeModal();
        renderVault();
        const parts = [];
        if(newOnes.length > 0) parts.push(`thêm ${newOnes.length} tài khoản mới`);
        if(overwrittenCount) parts.push(`ghi đè ${overwrittenCount} tài khoản trùng`);
        if(dupPairs.length && !overwrittenCount) parts.push(`bỏ qua ${dupPairs.length} tài khoản trùng`);
        if(skippedCount > 0) parts.push(`bỏ qua ${skippedCount} dòng không hợp lệ`);
        toast(`Đã ${parts.join(', ')}`);
      };

      if(dupPairs.length === 0){
        await finishBulk(0);
        return;
      }

      showBulkDuplicateChoice(dupPairs.length, async (overwriteAll) => {
        if(overwriteAll){
          dupPairs.forEach(({ fields, existing }) => {
            fields.folderId = folderId;
            fields.platform = platform;
            fields.updatedAt = Date.now();
            Object.assign(existing, fields);
          });
        }
        await finishBulk(overwriteAll ? dupPairs.length : 0);
      });
    }
  }
}

// Enter key confirms the modal's primary action, wherever focus is inside it —

document.getElementById('modalBg').addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  if(e.target.tagName === 'TEXTAREA') return;
  const primaryBtn = document.querySelector('#modalBody [data-primary-action]');
  if(primaryBtn && !primaryBtn.disabled){
    e.preventDefault();
    primaryBtn.click();
  }
});

// ---------- TOTP (Google Authenticator style 2FA code generator) ----------
let totpLastWindow = -1;
let lastExpiryCheckMinute = -1;
let proxyExpiryNoticeTimer = null;
const totpCodeCache = {};
const BASE32_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

function base32Decode(input){
  const raw = String(input || '').trim().toUpperCase();
  // Whitespace is accepted for readability, but any other non-Base32
  // character invalidates the whole secret instead of being silently removed.
  if(!raw || !/^[A-Z2-7\s]+$/.test(raw)) return null;
  const clean = raw.replace(/\s+/g, '');
  let bits = '';
  for(const c of clean){
    const idx = BASE32_ALPHABET.indexOf(c);
    if(idx === -1) continue;
    bits += idx.toString(2).padStart(5, '0');
  }
  const byteCount = Math.floor(bits.length / 8);
  const bytes = new Uint8Array(byteCount);
  for(let i = 0; i < byteCount; i++){
    bytes[i] = parseInt(bits.substr(i * 8, 8), 2);
  }
  return bytes;
}

async function computeTotp(secretRaw, period = 30, digits = 6){
  try{
    const keyBytes = base32Decode(secretRaw);
    if(!keyBytes || keyBytes.length === 0) return null;
    const counter = Math.floor(Date.now() / 1000 / period);
    const counterBuf = new ArrayBuffer(8);
    const view = new DataView(counterBuf);
    view.setUint32(0, 0);
    view.setUint32(4, counter);
    const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', cryptoKey, counterBuf);
    const hmac = new Uint8Array(sig);
    const offset = hmac[hmac.length - 1] & 0x0f;
    const binCode = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset + 1] & 0xff) << 16) | ((hmac[offset + 2] & 0xff) << 8) | (hmac[offset + 3] & 0xff);
    return (binCode % (10 ** digits)).toString().padStart(digits, '0');
  }catch(e){
    return null;
  }
}

// A live TOTP code is only valid for 30 seconds, so its color counts down
// with it — plenty of time (blue) → still fine (green) → running low
// (yellow) → about to expire, copy now (red). One shared helper used by
// every place in the app that shows a live 2FA code, so they all behave
// exactly the same way.
function totpColorForSecondsLeft(secsLeft){
  if(secsLeft > 22) return '#60a5fa'; // blue — just refreshed
  if(secsLeft > 15) return '#4ade80'; // green — plenty of time
  if(secsLeft > 7) return '#facc15';  // yellow — starting to run low
  return '#f87171';                    // red — about to expire
}
function currentTotpSecondsLeft(){
  return 30 - (Math.floor(Date.now() / 1000) % 30);
}
// Recolors every visible live 2FA code (entry list chips, the standalone
// decoder tool, anywhere else) to match how much time is left in the
// current 30-second window. Cheap enough to run every second — it never
// recomputes the code itself, just the color.
function updateTotpColors(){
  const color = totpColorForSecondsLeft(currentTotpSecondsLeft());
  document.querySelectorAll('[data-totp-val]').forEach(span => {
    span.style.color = color;
  });
}

async function refreshTotpCodes(){
  const list = (state.visibleEntries || []).filter(e => e.twoFA);
  await Promise.all(list.map(async (entry) => {
    const span = document.getElementById(`totp-val-${entry.id}`);
    if(!span) return;
    const code = await computeTotp(entry.twoFA);
    if(code){
      totpCodeCache[entry.id] = code;
      span.textContent = code;
    } else {
      span.textContent = 'Lỗi mã';
    }
  }));
  updateTotpColors();
}

// ---------- CLOCK & STATUS ----------
const VI_DAYS = ['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const MM = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const timeEl = document.getElementById('clockTime');
  const dateEl = document.getElementById('clockDate');
  if(timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
  if(dateEl) dateEl.textContent = `${VI_DAYS[now.getDay()]}, ${dd}/${MM}/${yyyy}`;

  const currentWindow = Math.floor(Date.now() / 1000 / 30);
  if(currentWindow !== totpLastWindow){
    totpLastWindow = currentWindow;
    refreshTotpCodes();
  } else {
    updateTotpColors();
  }

  updateSessionClock();
  checkAutoLogout();
  // expiry status doesn't need per-second precision — only re-scan once a minute
  const currentMinute = Math.floor(Date.now() / 60000);
  if(currentMinute !== lastExpiryCheckMinute){
    lastExpiryCheckMinute = currentMinute;
    checkPhoneExpiryNotifications();
    checkProxyExpiryNotifications();
  }
}
function updateTotalBadge(){
  const el = document.getElementById('clockTotal');
  if(!el) return;
  if(state.key){
    el.innerHTML = `<i class="ti ti-users"></i>Tổng: ${state.entries.length} tài khoản`;
  } else {
    el.innerHTML = `<i class="ti ti-lock"></i>Đang khoá`;
  }
}

// ---------- SESSION: login time, active duration, auto-logout ----------
function formatDuration(ms){
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function startSession(){
  const now = Date.now();
  state.session.loginTime = now;
  state.session.lastActivity = now;
}

function endSession(){
  state.session.loginTime = null;
  state.session.lastActivity = null;
  state.phoneNotified = new Set();
  state.proxyAlertDismissedIds = new Set();
  clearPersistedSessionKey(); // any lock/logout — explicit, auto, or via switching vault files — always really locks
  const box = document.getElementById('sessionClock');
  if(box) box.classList.remove('show');
  const proxyBar = document.getElementById('proxyAlertBar');
  if(proxyBar){ proxyBar.classList.remove('show'); proxyBar.innerHTML = ''; }
  if(proxyExpiryNoticeTimer){ clearTimeout(proxyExpiryNoticeTimer); proxyExpiryNoticeTimer = null; }
}

function markActivity(){
  if(state.key && state.session.loginTime){
    state.session.lastActivity = Date.now();
  }
}
['click','keydown','touchstart','scroll'].forEach(evt => {
  document.addEventListener(evt, markActivity, { passive: true });
});

function updateSessionClock(){
  const box = document.getElementById('sessionClock');
  if(!box) return;
  if(!state.key || !state.session.loginTime){
    box.classList.remove('show');
    return;
  }
  box.classList.add('show');
  const loginDate = new Date(state.session.loginTime);
  const hh = String(loginDate.getHours()).padStart(2,'0');
  const mm = String(loginDate.getMinutes()).padStart(2,'0');
  const ss = String(loginDate.getSeconds()).padStart(2,'0');
  const loginEl = document.getElementById('sessionLogin');
  const activeEl = document.getElementById('sessionActive');
  if(loginEl) loginEl.textContent = `Đăng nhập lúc ${hh}:${mm}:${ss}`;
  if(activeEl) activeEl.textContent = formatDuration(Date.now() - state.session.loginTime);
}

function checkAutoLogout(){
  if(!state.key || !state.session.lastActivity) return;
  const idleFor = Date.now() - state.session.lastActivity;
  if(idleFor >= AUTO_LOGOUT_MS){
    state.key = null;
    state.entries = [];
    state.folders = [];
    state.notes = [];
    endSession();
    closeModal();
    renderApp();
    toast('Đã tự động đăng xuất do không hoạt động 30 phút');
  }
}

// ---------- PHONE EXPIRY NOTIFICATIONS ----------
// warns once per session as soon as a "Phone" entry's Ngày hết hạn (expiry date)
// is within 1 day away (today or tomorrow)
function checkPhoneExpiryNotifications(){
  if(!state.key) return;
  const dueSoon = [];
  state.entries.filter(e => e.platform === 'phone' && e.expiryDate).forEach(e => {
    const info = phoneExpiryInfo(e.expiryDate);
    if(!info) return;
    if(info.diffDays >= 0 && info.diffDays <= 1 && !state.phoneNotified.has(e.id)){
      state.phoneNotified.add(e.id);
      dueSoon.push({ label: e.fbName || e.displayName || '(chưa có số)', diffDays: info.diffDays });
    }
  });
  if(dueSoon.length === 1){
    const d = dueSoon[0];
    toast(`⚠ SĐT ${d.label} ${d.diffDays === 0 ? 'hết hạn hôm nay' : 'sắp hết hạn (còn 1 ngày)'}`, 10000);
  } else if(dueSoon.length > 1){
    toast(`⚠ ${dueSoon.length} số điện thoại sắp hết hạn trong 1 ngày tới`, 10000);
  }
}

// ---------- PROXY RENEWAL BANNER (top-center, persistent until dismissed) ----------
function checkProxyExpiryNotifications(){
  if(!state.key) return;
  const dueSoon = [];
  state.entries.filter(e => e.platform === 'proxy' && e.expiryDate).forEach(e => {
    const info = phoneExpiryInfo(e.expiryDate);
    if(!info) return;
    if(info.diffDays >= 0 && info.diffDays <= 1 && !state.proxyAlertDismissedIds.has(e.id)){
      dueSoon.push({ id: e.id, label: e.fbName || e.displayName || '(chưa có IP)', diffDays: info.diffDays });
    }
  });
  renderProxyAlertBar(dueSoon);
}

function renderProxyAlertBar(dueSoon){
  const bar = document.getElementById('proxyAlertBar');
  if(!bar) return;
  if(proxyExpiryNoticeTimer){ clearTimeout(proxyExpiryNoticeTimer); proxyExpiryNoticeTimer = null; }
  if(dueSoon.length === 0){
    bar.classList.remove('show');
    bar.innerHTML = '';
    return;
  }
  const msg = dueSoon.length === 1
    ? `⚠ Proxy ${escapeHtml(dueSoon[0].label)} ${dueSoon[0].diffDays === 0 ? 'đã hết hạn hôm nay' : 'sắp hết hạn (còn 1 ngày)'} — hãy gia hạn`
    : `⚠ ${dueSoon.length} proxy sắp hết hạn trong 1 ngày tới — hãy gia hạn`;
  bar.innerHTML = `<span>${msg}</span><button type="button" id="proxyAlertDismissBtn" title="Đóng">&times;</button>`;
  bar.classList.add('show');
  const dismiss = () => {
    dueSoon.forEach(d => state.proxyAlertDismissedIds.add(d.id));
    checkProxyExpiryNotifications();
  };
  document.getElementById('proxyAlertDismissBtn').onclick = dismiss;
  proxyExpiryNoticeTimer = setTimeout(dismiss, 10000);
}

tickClock();
setInterval(tickClock, 1000);
updateTotalBadge();

// ---------- AUTOMATIC NETWORK STATUS ----------
// Network access is always enabled. The local backend is the primary IP source;
// direct browser lookups are only a fallback for deployments without that route.
const IP_LOOKUP_SOURCES = [
  { url: 'https://api.ipify.org?format=json', parse: async (res) => (await res.json()).ip },
  { url: 'https://api64.ipify.org?format=json', parse: async (res) => (await res.json()).ip },
  { url: 'https://ipapi.co/json/', parse: async (res) => (await res.json()).ip },
  { url: 'https://icanhazip.com/', parse: async (res) => (await res.text()).trim() },
  { url: 'https://checkip.amazonaws.com/', parse: async (res) => (await res.text()).trim() },
];

async function fetchMyIp(){
  for(const source of IP_LOOKUP_SOURCES){
    try{
      const res = await fetch(source.url, { cache: 'no-store' });
      if(!res.ok) continue;
      const ip = await source.parse(res);
      if(ip && /^[0-9a-fA-F:.]+$/.test(ip)) return ip;
    }catch(e){
      // try the next source
    }
  }
  return null;
}

async function refreshNetworkStatus(){
  const ipEl = document.getElementById('networkIpText');
  if(!ipEl) return;
  if(typeof navigator !== 'undefined' && !navigator.onLine){
    ipEl.textContent = 'Không có mạng';
    return;
  }
  ipEl.textContent = 'Đang lấy địa chỉ IP...';
  let ip = null;
  try{
    const response = await fetch(`/devic3-network-status?t=${Date.now()}`, {
      headers: { 'Accept': 'application/json' }, cache: 'no-store', credentials: 'same-origin'
    });
    const text = await response.text();
    const result = text ? JSON.parse(text) : null;
    if(response.ok && result?.online && result.ip) ip = String(result.ip);
  }catch(e){}
  if(!ip) ip = await fetchMyIp();
  ipEl.textContent = ip ? `IP: ${ip}` : 'Không có mạng';
}

function initNetworkStatus(){
  const ipEl = document.getElementById('networkIpText');
  if(ipEl){
    ipEl.style.cursor = 'pointer';
    ipEl.title = 'Bấm để thử lấy lại địa chỉ IP';
    ipEl.onclick = refreshNetworkStatus;
  }
  refreshNetworkStatus();
  setInterval(refreshNetworkStatus, 60 * 1000);
  if(typeof window !== 'undefined'){
    window.addEventListener('online', refreshNetworkStatus);
    window.addEventListener('offline', () => { const el = document.getElementById('networkIpText'); if(el) el.textContent = 'Không có mạng'; });
  }
}
initNetworkStatus();

// ---------- BOOT ----------
async function renderApp(){
  updateTotalBadge();
  let config;
  try{
    config = await loadConfig();
  }catch(e){
    console.error(e);
    renderLockedShellChrome('unlock');
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="lock-wrap">
        <div class="lock-icon" style="color:var(--danger-text);"><i class="ti ti-alert-triangle"></i></div>
        <div class="center-form">
          <h1>Không thể đọc kho lưu trữ</h1>
          <p class="hint" style="line-height:1.6;">${escapeHtml(e.message || 'Bộ nhớ trình duyệt không truy cập được hoặc cấu hình kho đã bị hỏng.')} Dữ liệu chưa bị ghi đè. Hãy tải lại trang hoặc khôi phục từ file sao lưu.</p>
          <button class="primary" id="reloadAfterStorageErrorBtn" style="width:100%;">Tải lại trang</button>
        </div>
      </div>`;
    document.getElementById('reloadAfterStorageErrorBtn').onclick = () => location.reload();
    return;
  }
  if(!config){
    renderSetup();
    return;
  }
  // if "keep session across F5" was turned on and this tab still has a live
  // session key for THIS exact vault, skip the unlock screen entirely
  if(await getKeepSessionPref()){
    const restoredKey = await tryRestoreSessionKey(config.salt);
    if(restoredKey){
      try{
        state.key = restoredKey;
        await loadEntries();
        await loadFolders();
        await loadNotes();
        startSession();
        renderVault();
        return;
      }catch(e){
        console.error(e);
        state.key = null;
        clearPersistedSessionKey();
      }
    }
  }
  renderUnlock(config);
}
const sidebarToggleBtnEl = document.getElementById('sidebarToggleBtn');
if(sidebarToggleBtnEl){
  sidebarToggleBtnEl.onclick = () => {
    const sb = document.getElementById('platformBar');
    const rp = document.getElementById('sidePanel');
    if(rp) rp.classList.remove('open'); // don't show both drawers at once on a narrow screen
    if(sb) sb.classList.toggle('open');
  };
}
const rightPanelToggleBtnEl = document.getElementById('rightPanelToggleBtn');
if(rightPanelToggleBtnEl){
  rightPanelToggleBtnEl.onclick = () => {
    const rp = document.getElementById('sidePanel');
    const sb = document.getElementById('platformBar');
    if(sb) sb.classList.remove('open');
    if(rp) rp.classList.toggle('open');
  };
}
document.querySelectorAll('.ide-lang-btn').forEach(btn => {
  btn.onclick = () => setLangPref(btn.dataset.lang);
});
// Supports the browser's Back/Forward buttons switching between tabs (since
// each tab click pushes a URL hash), and keeps things in sync if the same
// vault is ever open in two windows side by side.
window.addEventListener('hashchange', () => {
  const p = getPlatformFromHash();
  if(p && state.key && p !== state.activePlatform){
    state.activePlatform = p;
    state.activeFolder = 'all';
    renderVault();
  }
});
// Esc closes whichever modal is currently open, from anywhere on the page.
// "/" jumps straight to the search box — skipped while already typing
// somewhere else, so it never hijacks a "/" typed into a password field etc.
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    const modalBg = document.getElementById('modalBg');
    if(modalBg && modalBg.classList.contains('show')) closeModal();
    return;
  }
  if(e.key === '/' && state.key){
    const active = document.activeElement;
    const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
    if(isTyping) return;
    const searchInput = document.getElementById('globalSearchInput');
    if(searchInput){
      e.preventDefault();
      searchInput.focus();
    }
  }
});
(async () => {
  state.lang = await loadLangPref();
  updateLangSwitchUI();
  renderApp();
})();

// PWA: registers the offline service worker when the app is actually served
// over http(s) (GitHub Pages, Netlify, a local dev server, etc.), which is
// what makes the browser's "Install app" prompt available. Opening the file
// directly from disk (file://) doesn't support service workers at all — this
// silently no-ops in that case instead of throwing, so it's always safe to
// leave in regardless of how the file is being used.
if('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
